---
substitutions:
  name: cores3-base-bsp
  friendly_name: M5Stack CoreS3 Base BSP

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  name_add_mac_suffix: true
  on_boot:
    - priority: 600
      then:
        # Chip-level PMIC settings. The rails themselves are brought up by the
        # `regulator:` platform below, which runs at HARDWARE priority (800):
        # after the PMIC hub has verified the chip (IO, 900) and before this
        # trigger and any DATA component's setup(), so the LTR-553, ES7210 and
        # AW88298 find their supplies already on.
        - lambda: |-
            // The 5 V bus is a capacitive load, and its inrush drags VSYS low
            // enough to trip the PMIC's per-converter under-voltage detector.
            // That does not brown out the SoC: the AXP2101 switches the whole
            // board off and stays off until the power key is pressed, which
            // cannot be recovered from in software. It is a latch, not a load
            // limit, so it goes away before the BUS output is switched on.
            // M5's own firmware does the same in Power_Class::begin().
            if (const auto *uvp = id(axp2101_pmu)->find_flag("dcdc_uvp_shutdown"); uvp != nullptr) {
              id(axp2101_pmu)->write_flag(*uvp, false);
            }
            // TS pin. On this board it senses the BUS 5 V rail instead of a
            // battery thermistor, so two things have to happen before anything
            // reads it: the pin has to stop being the charger's temperature
            // input (left as the thermistor the charger sees a permanently cold
            // cell and never charges), and its ADC channel has to be switched
            // on. The power-on value comes from EFUSE and differs per chip.
            if (const auto *ts_mode = id(axp2101_pmu)->find_flag("ts_external_input"); ts_mode != nullptr) {
              id(axp2101_pmu)->write_flag(*ts_mode, true);
            }
            if (const auto *ts = id(axp2101_pmu)->find_adc_channel("ts_voltage"); ts != nullptr) {
              id(axp2101_pmu)->set_adc_enabled(*ts, true);
            }
        # Seed the system clock from the RTC before the network is up.
        - bm8563.read_time:
    - priority: 500
      then:
        # Light the panel only after the display and touch drivers have run
        # their setup(), so the backlight never comes up over an uninitialised
        # panel.
        - light.turn_on:
            id: lcd_backlight
            brightness: 80%

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  flash_mode: qio
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic

psram:
  mode: quad
  speed: 80MHz

api:

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:


improv_serial:

improv_ble:
  authorizer: none

captive_portal:

network:
  enable_high_performance: true

# Enable logging
logger:
  level: DEBUG

# Runtime diagnostics hub. The values are published through the `debug` sensor
# platform in the `sensor:` block below.
debug:
  update_interval: 60s

i2c:
  - id: bsp_bus
    sda: GPIO12
    scl: GPIO11
    frequency: 400kHz
  - id: ext_bus
    sda: GPIO2
    scl: GPIO1

spi:
  - id: spi_bus
    clk_pin: GPIO36
    mosi_pin: GPIO37

# --- Base DIN: PORT B / PORT C -----------------------------------------------
# PORT B and PORT C are only brought out by the DIN Base. On a bare CoreS3 these
# four pins reach no connector, and they are shared with other uses, so they are
# deliberately NOT claimed here: uncomment a block only when the board really
# sits on a DIN Base, and make sure nothing else took the pin.
#
#   PORT B: GPIO8 = pin 1 (near 5V, input side), GPIO9 = pin 2 (output side).
#           Both are ADC1 channels (CH7 / CH8) on the ESP32-S3, 12-bit.
#   PORT C: GPIO17 = TX, GPIO18 = RX (UART1's default IOMUX pins).
#
# Example PORT B analog input + digital input:
#   sensor:
#     - platform: adc
#       pin: GPIO9
#       name: "PORT B ADC"
#       attenuation: 12db
#       update_interval: 10s
#   binary_sensor:
#     - platform: gpio
#       name: "PORT B Input"
#       pin:
#         number: GPIO8
#         mode:
#           input: true
#           pullup: true
#
# Example PORT C UART:
#   uart:
#     - id: port_c_uart
#       tx_pin: GPIO17
#       rx_pin: GPIO18
#       baud_rate: 115200

i2s_audio:
  id: i2s_audio_bus
  i2s_lrclk_pin: GPIO33
  i2s_bclk_pin: GPIO34
  i2s_mclk_pin:
    number: GPIO0
    ignore_strapping_warning: true

external_components:
  # feat-axp: axp_base + axp2101 + assorted new components. `regulator` is the
  # provider platform the power rails are configured with; it is not in the
  # 2026.10 release.
  - source: github://m5stack/esphome@feat-axp
    components: [axp_base, axp2101, regulator]
    refresh: 0s

  - source: github://m5stack/esphome@feat-aw9523b
    components: [aw9523b]
    refresh: 0s

  # feat-awinic-amp: aw88298 with reset pin, I2S frame, boost/AGC and entities
  - source: github://m5stack/esphome@feat-awinic-amp
    components: [aw88298]
    refresh: 0s

axp2101:
  id: axp2101_pmu
  i2c_id: bsp_bus
  update_interval: 30s
  event_poll_interval: 100ms

# Power rails of the PMIC, as regulators. `always_on` implies `boot_on`, so
# each rail is set to its voltage and switched on during setup(), before any
# DATA component is probed, and nothing may switch it off afterwards.
regulator:
  - platform: axp2101
    axp_id: axp2101_pmu
    always_on: true
    rails:
      - id: rail_aldo1
        rail: ALDO1
        voltage: 1800mV   # AW88298 DVDD
      - id: rail_aldo2
        rail: ALDO2
        voltage: 3300mV   # ES7210 / AW88298 PVDD
      - id: rail_aldo3
        rail: ALDO3
        voltage: 3300mV   # camera module + LTR-553
      - id: rail_aldo4
        rail: ALDO4
        voltage: 3300mV   # TF card slot
      - id: rail_bldo1
        rail: BLDO1
        voltage: 2800mV   # camera AVDD
      - id: rail_bldo2
        rail: BLDO2
        voltage: 1500mV   # camera DVDD

aw9523b:
  id: aw9523b_hub
  i2c_id: bsp_bus
  p0_drive_mode: PUSH_PULL
  interrupt_pin: GPIO21

motion:
  - platform: bmi270
    id: imu
    i2c_id: bsp_bus
    address: 0x69
    update_interval: 50ms
    accelerometer_range: 4G
    accelerometer_odr: 100HZ
    gyroscope_range: 1000DPS
    gyroscope_odr: 200HZ
    # The board also carries a BMM150 magnetometer (U20), but it is not on the
    # main I2C bus: its SDA/SCL go to the BMI270's aux (secondary master) pins,
    # and PS/CSB/SDO are tied to GND, so it sits at 0x10 behind the BMI270.
    # `aux_device: BMM150` brings it up and folds its 8 data bytes into the same
    # burst read as the motion samples. It is not enabled here because the
    # option and the `encode_value_le()` core helper it needs only exist in
    # ESPHome >= 2026.11 (upstream PR #18436); 2026.10 rejects the key.
    # aux_device: BMM150

output:
  # DLDO1: LCD backlight
  - platform: axp2101
    id: lcd_backlight_output
    rail: DLDO1
    min_voltage: 2600
    max_voltage: 3300

binary_sensor:
  - platform: gpio
    name: "ES7210 Interrupt"
    pin:
      aw9523b_id: aw9523b_hub
      number: 3
      inverted: true

  - platform: gpio
    name: "SDCard Interrupt"
    pin:
      aw9523b_id: aw9523b_hub
      number: 4
      inverted: true

  - platform: gpio
    name: "AW88298 Interrupt"
    pin:
      aw9523b_id: aw9523b_hub
      number: 11
      inverted: true

  # AW88298 status bits (SYSST), plus the combined fault state
  - platform: aw88298
    fault:
      name: "Amplifier Fault"
    clipping:
      name: "Amplifier Clipping"
    pre_clipping:
      name: "Amplifier Pre-Clipping"
    over_temperature:
      name: "Amplifier Over Temperature"
    over_current:
      name: "Amplifier Over Current"
    under_voltage:
      name: "Amplifier Under Voltage"
    no_clock:
      name: "Amplifier No Clock"
    clock_stable:
      name: "Amplifier Clock Stable"
    pll_locked:
      name: "Amplifier PLL Locked"
    amplifier_switching:
      name: "Amplifier Switching"
    boost_started:
      name: "Amplifier Boost Started"
    boost_adaptive:
      name: "Amplifier Boost Adaptive"
    boost_over_current:
      name: "Amplifier Boost Over Current"
    boost_over_voltage:
      name: "Amplifier Boost Over Voltage"
    boost_over_voltage_2:
      name: "Amplifier Boost Over Voltage 2"
  # PMIC status bits
  - platform: axp2101
    battery_charging:
      name: "Battery Charging"
    battery_discharging:
      name: "Battery Discharging"
    vbus_good:
      name: "VBUS Good"
    battery_present:
      name: "Battery Present"
      entity_category: diagnostic

  # BMI270 motion detectors
  - platform: motion
    type: moving
    name: "IMU Moving"

  - platform: motion
    type: free_fall
    name: "IMU Free Fall"

  # Which side rests on the table. Both use the generic 30° tilt threshold and
  # ignore short excursions around the threshold.
  - platform: motion
    type: face_up
    name: "IMU Face Up"

  - platform: motion
    type: face_down
    name: "IMU Face Down"

# RTC (BM8563). The time is written once Home Assistant syncs, and read back at
# boot so the clock survives a power cycle.
time:
  - platform: bm8563
    id: rtc
    i2c_id: bsp_bus
    update_interval: never

  - platform: homeassistant
    on_time_sync:
      then:
        - bm8563.write_time:

sensor:
  - platform: axp2101
    battery_voltage:
      name: "Battery Voltage"
    battery_level:
      name: "Battery Level"
    vbus_voltage:
      name: "VBUS Voltage"
    system_voltage:
      name: "System Voltage"
    die_temperature:
      name: "AXP2101 Temperature"
    # The TS pin is wired to the BUS 5 V rail on this board (no battery
    # thermistor): about 2.9 V at the pin when the connector carries 5 V. It is
    # the only way to tell whether something else is already powering the bus,
    # which is what the BUS output interlock below reads.
    ts_voltage:
      name: "TS Pin Voltage"

  # BMI270 accelerometer / tilt
  - platform: motion
    type: acceleration_x
    name: "IMU Acceleration X"

  - platform: motion
    type: acceleration_y
    name: "IMU Acceleration Y"

  - platform: motion
    type: acceleration_z
    name: "IMU Acceleration Z"

  - platform: motion
    type: pitch
    name: "IMU Pitch"

  - platform: motion
    type: roll
    name: "IMU Roll"

  # BMI270 gyroscope, in deg/s. `angular_rate_*` exposes the same reading under
  # another name, so only one of the two families is configured.
  - platform: motion
    type: gyroscope_x
    name: "IMU Gyroscope X"

  - platform: motion
    type: gyroscope_y
    name: "IMU Gyroscope Y"

  - platform: motion
    type: gyroscope_z
    name: "IMU Gyroscope Z"

  # Which side faces up, in 90° steps. Reports NAN while the board lies flat
  # (tilt below `flat_threshold`), so it is not a continuous measurement.
  - platform: motion
    type: orientation
    name: "IMU Orientation"
    flat_threshold: 30.0

  # Die temperature of the IMU package itself, not the board. It is read from
  # the same data block as the motion samples, so it follows
  # `motion.update_interval`.
  - platform: bmi270
    type: temperature
    name: "IMU Temperature"

  # BMM150 magnetometer, reached through the BMI270's aux interface. Enable
  # together with `motion.aux_device: BMM150` on ESPHome >= 2026.11. Raw µT
  # readings: no hard/soft-iron calibration is applied, so the absolute offsets
  # change with whatever is near the board (speaker magnet, screws, cables).
  # - platform: bmi270
  #   type: magnetic_field_x
  #   name: "Magnetic Field X"
  #
  # - platform: bmi270
  #   type: magnetic_field_y
  #   name: "Magnetic Field Y"
  #
  # - platform: bmi270
  #   type: magnetic_field_z
  #   name: "Magnetic Field Z"

  # LTR-553ALS-WA: ambient light + proximity, on the camera flex cable
  - platform: ltr_als_ps
    i2c_id: bsp_bus
    address: 0x23
    type: ALS_PS
    ambient_light:
      name: "Ambient Light"
    ps_counts:
      name: "Proximity Counts"
    glass_attenuation_factor: 2.5
    auto_mode: true
    ps_cooldown: 5s
    ps_high_threshold: 500

  # AW88298 measurements, polled by the amplifier itself
  - platform: aw88298
    die_temperature:
      name: "Amplifier Temperature"
    supply_voltage:
      name: "Amplifier Supply"
    amplifier_voltage:
      name: "Amplifier Output"
    boost_voltage:
      name: "Amplifier Boost Output"

  # ESPHome runtime diagnostics. Byte-valued sensors are converted to kB here
  # so the frontend never shows raw multi-hundred-thousand values; the two that
  # have a native unit keep it (fragmentation in %, loop time in ms).
  - platform: debug
    free:
      name: "Free Heap"
      unit_of_measurement: kB
      accuracy_decimals: 1
      filters:
        - multiply: 0.0009765625
    block:
      name: "Largest Free Heap Block"
      unit_of_measurement: kB
      accuracy_decimals: 1
      filters:
        - multiply: 0.0009765625
    min_free:
      name: "Minimum Free Heap"
      unit_of_measurement: kB
      accuracy_decimals: 1
      filters:
        - multiply: 0.0009765625
    psram:
      name: "Free PSRAM"
      unit_of_measurement: kB
      accuracy_decimals: 1
      filters:
        - multiply: 0.0009765625
    fragmentation:
      name: "Heap Fragmentation"
    loop_time:
      name: "Loop Time"

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "LCD Backlight"
    icon: "mdi:television"
    output: lcd_backlight_output
    # Stays dark through setup() on purpose: the boot trigger turns it on after
    # the panel is initialised, so the saved brightness is not restored here.
    restore_mode: ALWAYS_OFF
    default_transition_length: 250ms

event:
  - platform: axp2101
    name: "PMU Event"
    events:
      - vbus_insert
      - vbus_remove
      - battery_insert
      - battery_remove
      - power_key_short_press
      - power_key_long_press
      - charge_started
      - charge_done
    on_event:
      - logger.log:
          format: "AXP2101 event: %s"
          args: [event_type.c_str()]

  # Shake gesture from the motion hub. `threshold` is the acceleration delta in
  # g, `cooldown` stops one movement from firing the event repeatedly.
  - platform: motion
    name: "IMU Shake"
    threshold: 0.5
    cooldown: 500ms

button:
  - platform: template
    name: "Power Off"
    icon: "mdi:power"
    entity_category: config
    on_press:
      - axp2101.shutdown: axp2101_pmu

  - platform: template
    name: "Restart SoC"
    icon: "mdi:restart"
    entity_category: config
    on_press:
      - axp2101.restart: axp2101_pmu

  - platform: template
    name: "Reset Fuel Gauge"
    icon: "mdi:battery-sync"
    entity_category: config
    on_press:
      - axp2101.reset_gauge: axp2101_pmu

select:
  # The selects below run their setup() at HARDWARE priority: after the PMIC hub
  # (IO) and before anything at DATA, including the `on_boot` trigger that hands
  # the TS pin to the charger. The AXP2101's charge-voltage register is not
  # reliably at the 4.2 V default after power-on (a unit read 0x00, reserved),
  # so the target has to be in place before the charger is allowed to start.
  - platform: axp2101
    charge_current:
      name: "Charge Current"
    charge_voltage:
      name: "Charge Voltage"
      initial_option: 4.2V
    input_current_limit:
      name: "Input Current Limit"
    power_key_long_press:
      name: "Power Key Long Press"

  # AW88298 runtime settings
  - platform: aw88298
    boost_mode:
      name: "Amplifier Boost Mode"
    boost_deglitch:
      name: "Amplifier Boost Deglitch"

  # One option per usable row of the 5 V power path table above, worded as what
  # the board does rather than which pin it flips.
  - platform: template
    id: power_path
    name: "5V Power Path"
    icon: "mdi:power-socket"
    # The ORDER is load-bearing: the trigger below switches on the option index
    # (its second argument `i`), not on the text, so renaming an option can no
    # longer break the logic. Keep this list and the index map in step.
    options:
      - "Power from USB / BUS (External Power)"   # 0  inputs only
      - "Power the BUS (Battery or USB)"          # 1  BUS out
      - "Power the USB port (Using BUS Input)"    # 2  USB out, fed by the BUS
      - "Power BUS and USB (Using Battery)"       # 3  both out
    # Read the real pin state back instead of trusting the request: a refused
    # change, or a reboot that resets the pins, can never leave a stale value in
    # the frontend. Also why there is no `optimistic` here.
    update_interval: 1s
    lambda: |-
      // Derive the index from the pins and pull the text from `options:` itself,
      // so the readback cannot drift out of sync with the option list.
      //   0 = inputs only   1 = BUS out   2 = USB out (fed by the BUS)   3 = both
      const bool bus = id(bus_out_en)->state && id(boost_en)->state;
      const bool usb = id(usb_otg_en)->state;
      const size_t index = bus ? (usb ? 3 : 1) : (usb ? 2 : 0);
      return std::string{id(power_path)->option_at(index)};
    set_action:
      # A select's set_action only hands over the option *text* (`x`), not its
      # position. The text is resolved to the index once here; the script then
      # works purely on indices, so no option string is repeated anywhere.
      - script.execute:
          id: power_path_apply
          choice: !lambda |-
            size_t index = 0;
            while (id(power_path)->has_index(index) && 
                  !(x == id(power_path)->option_at(index))) {
              index++;
            }
            return static_cast<int>(index);

number:
  - platform: aw88298
    boost_voltage:
      name: "Amplifier Boost Target"
    boost_current_limit:
      name: "Amplifier Boost Current Limit"
    boost_attack_threshold:
      name: "Amplifier Boost Attack Threshold"
    boost_release_threshold:
      name: "Amplifier Boost Release Threshold"
    agc_attack_threshold:
      name: "Amplifier AGC Attack Threshold"
    agc_release_threshold:
      name: "Amplifier AGC Release Threshold"
    agc_attack_time:
      name: "Amplifier AGC Attack Time"
    agc_release_time:
      name: "Amplifier AGC Release Time"
    agc_hold_time:
      name: "Amplifier AGC Hold Time"

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    bits_per_sample: 16bit
    sample_rate: 48000
    mic_gain: 36

audio_dac:
  - platform: aw88298
    id: aw88298_dac
    i2c_id: bsp_bus
    address: 0x36
    # RSTN is active low and sits on the IO expander; the driver now drives it
    # itself, so the GPIO switch that used to release the reset is gone.
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 2
    # Frame the amplifier receives (also resolvable from the speaker).
    sample_rate: 48000
    bits_per_sample: 16bit
    i2s_format: i2s
    i2s_channel: left
    slot_bits: 16
    slot_count: 2
    ws_pulse: slot
    # Speaker path. HDCC removes the DC offset. AGC is left off in the initial
    # register set but can be turned on at runtime with the AGC switch.
    hdcc: true
    input_attenuation: false
    volume_min_db: -96dB
    volume_max_db: 0dB
    initial_volume: 100%
    update_interval: 60s
    # Feed-forward boost. 5.0 V matches M5's esp_codec_dev setup and keeps the
    # 1 W speaker within what the cell can deliver.
    boost:
      mode: smart_boost_2
      voltage: 5.0V
      current_limit: 3.5A
      deglitch: 21.3ms
      attack_threshold: 30%
      release_threshold: 15%

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO14
    adc_type: external
    sample_rate: 48000
    bits_per_sample: 16bit

speaker:
  # Hardware output: AW88298 over I2S
  - platform: i2s_audio
    id: hw_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO13
    dac_type: external
    audio_dac: aw88298_dac
    sample_rate: 48000
    bits_per_sample: 16bit

  - platform: mixer
    id: audio_mixer
    output_speaker: hw_speaker
    num_channels: 1
    bits_per_sample: 16
    task_stack_in_psram: true
    source_speakers:
      - id: media_speaker_mix       # Music/radio streams (duckable)
        timeout: 10s
        buffer_duration: 100ms
      - id: tts_speaker_mix         # VA TTS announcements (never ducked)
        timeout: 10s
        buffer_duration: 100ms

  - platform: resampler
    id: media_speaker              # Music/radio → 48kHz
    output_speaker: media_speaker_mix
    task_stack_in_psram: true

  - platform: resampler
    id: tts_speaker                # VA TTS → 48kHz
    output_speaker: tts_speaker_mix
    task_stack_in_psram: true

media_player:
  - platform: speaker
    name: "CoreS3 Speaker"
    id: speaker_media_player
    task_stack_in_psram: true
    media_pipeline:
      speaker: media_speaker
      sample_rate: 48000
      format: FLAC
    announcement_pipeline:
      speaker: tts_speaker
      format: FLAC
      sample_rate: 48000

# --- 5 V power path ---------------------------------------------------------
# The CoreS3 has two connectors whose 5 V can be an input or an output, selected
# by two pins that drive four ME1502 load switches between them.
#
# The important detail (measured, not obvious from the block diagram): U17 is fed
# from the BUS_OUT node, NOT straight from the boost. The only path to 5 V on the
# USB-C connector is therefore
#
#   SY7088 -> BUS_5V -> U14 -> BUS_OUT -> U17 -> VUSB
#
# so a USB output needs BUS_OUT_EN = 1 as well.
#
#   BUS_OUT_EN  USB_OTG_EN   U14 BUS_5V→BUS_OUT  U17 BUS_OUT→VUSB   BUS port  USB port
#   0           0            off                 off                input     input
#   1           0            ON                  off                output    input
#   0           1            off                 ON                 input     mirrors BUS
#   1           1            ON                  ON                 output    output
#
# Row 3 has no source of its own: U19 ties BUS_OUT to VBUS and U17 copies that
# node onto the USB port, so the USB-C connector simply mirrors whatever is on
# the BUS connector. On battery alone it therefore delivers nothing - that is a
# property of the board, not a bug here.
#
# Row 1 ties both connectors to the same VBUS node, so whatever is plugged into
# one is electrically present on the other.
script:
  # Applies one of the power-path options. `choice` is the index into the
  # select's `options:` list, so nothing here depends on the option text.
  #
  # Everything happens in one action list on purpose: with two independent
  # scripts each one inspected a pin the other was about to change, so the USB
  # script saw "bus not on yet" and scheduled a boost shutdown that then killed
  # the bus ~150 ms after it came up.
  #
  # The boost only ever feeds U14 (U17 is fed from BUS_OUT), so the rule is
  # simply: converter on <=> BUS output on.
  - id: power_path_apply
    mode: restart
    parameters:
      choice: int
    then:
      # Interlocks first. `then:` is the whole apply sequence, so a refusal
      # leaves every pin where it is.
      - if:
          condition:
            lambda: |-
              const bool want_bus = choice == 1 || choice == 3;
              const bool want_usb = choice == 2 || choice == 3;

              auto *pmu = id(axp2101_pmu);
              if (!pmu->update_status()) {
                return false;  // cannot tell, refuse
              }
              const auto *batt = pmu->find_status_flag("battery_present");
              const auto *vbus = pmu->find_status_flag("vbus_good");
              const bool has_batt = batt != nullptr && pmu->status_bit(batt->bit);
              const bool has_vbus = vbus != nullptr && pmu->status_bit(vbus->bit);

              // Driving the USB port from the boost (BUS output on) opens U18, so
              // the PMIC loses VBUS and the cell is the only supply left. VBUS
              // also has to be empty: with a cable connected the boost would
              // fight the host on the same wire. "A battery is fitted and VBUS is
              // not present" covers both. The BUS-input row needs neither: it
              // only copies the BUS node, which is already whatever feeds VBUS.
              if (want_usb && want_bus && (has_vbus || !has_batt)) {
                return false;
              }
              // Switching the boost onto a bus that something else already holds
              // up puts two supplies on one rail. Same test M5 makes before
              // enabling its output; only a batteryless unit on USB can get here.
              if (want_bus && !has_batt && has_vbus) {
                const auto *ts = pmu->find_adc_channel("ts_voltage");
                if (ts != nullptr) {
                  const float pin = pmu->read_adc(*ts);
                  // ~2.0 V at the pin is a bus above roughly 3.4 V; an
                  // unreadable channel counts as unsafe.
                  if (std::isnan(pin) || pin > 2.0f) {
                    return false;
                  }
                }
              }
              return true;
          then:
            # 1) Open the BUS side first when it is going away. Stop the converter
            #    and let the bus bleed down (~80 ms unloaded) before closing U19:
            #    flipping BUS_OUT_EN while the bus is still at 5 V ties the boost
            #    output to VBUS. M5 sequences it the same way.
            - if:
                condition:
                  lambda: 'return choice != 1 && choice != 3 && id(bus_out_en)->state;'
                then:
                  - switch.turn_off: boost_en
                  - delay: 200ms
                  - switch.turn_off: bus_out_en

            # 2) Converter up, then let it finish its soft start before the bus
            #    switch connects it to a load.
            - if:
                condition:
                  lambda: 'return choice == 1 || choice == 3;'
                then:
                  - switch.turn_on: boost_en
                  - delay: 50ms

            # 3) BUS port, precharged. A cold bus is a capacitive load and looks
            #    like a short for the first few hundred microseconds; connecting it
            #    in one step drags VSYS under the ESP32's own brownout level, so
            #    the SoC resets ("E BOD" followed by rst:0x3 RTC_SW_SYS_RST). The
            #    PMIC latch-off is already disabled, so this is the failure that is
            #    left. Eight pulses of growing on-time bring the bus to about
            #    1.7 V, past which the VBUS side holds it and the final switch-on
            #    is a small step. The pulse width is dominated by the expander
            #    write (~0.1 ms at 400 kHz), which is why the growing part only
            #    adds 0-112 us.
            - if:
                condition:
                  lambda: 'return (choice == 1 || choice == 3) && !id(bus_out_en)->state;'
                then:
                  - lambda: |-
                      for (int pulse = 0; pulse < 8; ++pulse) {
                        id(bus_out_en)->turn_on();
                        delayMicroseconds(pulse * 16);
                        id(bus_out_en)->turn_off();
                        delayMicroseconds(1000);
                      }
                  - switch.turn_on: bus_out_en

            # 4) USB port. In rows 1+3 it is fed from the BUS node, not the boost.
            - if:
                condition:
                  lambda: 'return choice == 2 || choice == 3;'
                then:
                  - switch.turn_on: usb_otg_en
                else:
                  - switch.turn_off: usb_otg_en

            # 5) No BUS output means no consumer for the converter.
            - if:
                condition:
                  lambda: 'return !id(bus_out_en)->state;'
                then:
                  - switch.turn_off: boost_en
          else:
            - lambda: |-
                ESP_LOGE("bsp", "Power path '%s' refused: unplug the USB-C cable (or fit a battery) first",
                         id(power_path)->option_at(choice));

switch:
  # --- 5 V power path: actuators only ---------------------------------------
  # From the CoreS3 schematic page 6, with the semantics M5Unified's
  # Power_Class uses (four ME1502 load switches):
  #   BOOST_EN    AW9523B P1_7  SY7088 boost: VBAT/VSYS -> BUS_5V
  #   BUS_OUT_EN  AW9523B P0_1  U14 (EN high) BUS_5V -> BUS_OUT
  #                             U19 (EN low)  BUS_OUT -> VBUS
  #   USB_OTG_EN  AW9523B P0_5  U17 (EN high) BUS_5V -> VUSB
  #                             U18 (EN low)  VUSB -> VBUS
  # Every pin is a source *selector*, not an enable: 0 does not mean "dead",
  # it means "this connector is tied to VBUS". The four combinations are
  # exposed one option at a time by `5V Power Path` above.
  #
  # These pins are raw actuators and stay `internal`: the order matters more
  # than the bits (on: boost first, then the switch; off: boost first, let the
  # bus bleed down, then the switch), and the scripts below own that sequence.
  - platform: gpio
    id: boost_en
    pin:
      aw9523b_id: aw9523b_hub
      number: 15
    internal: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: bus_out_en
    pin:
      aw9523b_id: aw9523b_hub
      number: 1
    internal: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: usb_otg_en
    name: "USB_OTG_EN"
    pin:
      aw9523b_id: aw9523b_hub
      number: 5
    internal: true
    restore_mode: ALWAYS_OFF

  # Camera module enable / reset (P1_0), active high. The camera rails
  # (ALDO3 + BLDO1/BLDO2) are always on through the `regulator:` platform.
  # `esp32_camera` is not used: the module is clocked by the on-board 20 MHz
  # oscillator (X2), so there is no ESP32 pin that could generate
  # `external_clock`.
  - platform: gpio
    name: "Camera Reset"
    pin:
      aw9523b_id: aw9523b_hub
      number: 8
    internal: true
    restore_mode: RESTORE_DEFAULT_ON

  # PMIC settings. The rails are powered by the `regulator:` platform, so only
  # the chip's own bits are driven here. Without a restore mode the charging
  # switch just reports what the chip holds after a power cycle.
  - platform: axp2101
    charging:
      name: "Charging"
    gauge:
      name: "Fuel Gauge"
      restore_mode: ALWAYS_ON
    # Cleared by the boot trigger, which runs before any of these switches set
    # up. No restore mode here, so the entity only reports the result.
    dcdc_uvp_shutdown:
      name: "DCDC UVP Shutdown"
    # Also written by the boot trigger; the reading is reported, never forced.
    ts_external_input:
      name: "TS External Input"

  # AW88298 runtime settings. Like the register map, they report the chip's
  # current state instead of forcing a value at boot.
  - platform: aw88298
    hdcc:
      name: "Amplifier HDCC"
    agc:
      name: "Amplifier AGC"
    agc_rms:
      name: "Amplifier AGC RMS"
    input_attenuation:
      name: "Amplifier Input Attenuation"
    receiver_mode:
      name: "Amplifier Receiver Mode"

display:
  - platform: mipi_spi
    model: M5CORE
    dc_pin: GPIO35
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 9
    cs_pin:
      number: GPIO3
      ignore_strapping_warning: true
    show_test_card: true
    data_rate: 40MHz
    invert_colors: true

touchscreen:
  - platform: ft63x6
    id: touch
    i2c_id: bsp_bus
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 0
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 240

esp32_camera:
  name: "Camera"
  icon: "mdi:camera"
  i2c_id: bsp_bus 
  vsync_pin:
    number: GPIO46
    ignore_strapping_warning: true
  href_pin: GPIO38
  # Just a virtual pin here, to pass the configuration
  # There is a external 20MHz crystal that serves as
  # 'external clock'
  external_clock:
    pin: GPIO6             
    frequency: 20MHz
  pixel_clock_pin:
    number: GPIO45
    ignore_strapping_warning: true
  data_pins: [GPIO39, GPIO40, GPIO41, GPIO42, GPIO15, GPIO16, GPIO48, GPIO47] # D0-D7
  # GC0308 native resolution; QVGA was only a downscale of this.
  resolution: 640x480
  # A VGA frame is 4x the pixels of QVGA and the sensor has no JPEG mode, so
  # every frame is converted in software on the main loop. Measured here: ~280 ms
  # per VGA frame (~70 ms at QVGA), which caps the usable rate at ~3.5 fps and
  # blocks everything else while it runs. 2 fps leaves roughly half the loop for
  # audio/API; drop to 1 fps if playback must stay glitch-free while streaming.
  max_framerate: 2.0 fps
  frame_buffer_count: 1
  frame_buffer_location: PSRAM
  pixel_format: RGB565
  # 100 - jpeg_quality is the encoder quality. esp32-camera's `fmt2jpg()` uses a
  # fixed 128 kB output buffer, so a VGA frame has to stay below that; 20 (=> 80)
  # lands well inside it. Raise the number if frames ever fail to encode.
  jpeg_quality: 20
  # Image-wide settings, independent of the resolution. Brightness/contrast/
  # saturation stay at their neutral values, white balance on AUTO and no tint.
  brightness: 1
  contrast: 1
  saturation: 0
  wb_mode: AUTO
  special_effect: NONE
  # Exposure and gain stay manual with the values tuned on this module; AUTO
  # would re-converge after any scene change.
  aec_mode: manual
  aec_value: 800
  agc_mode: manual
  agc_value: 30