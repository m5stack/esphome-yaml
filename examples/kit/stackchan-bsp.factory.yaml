# StackChan BSP
# CoreS3 base hardware plus the StackChan robot body: SCS9009 servos, Si12T
# head touch, ST25R3916 NFC, IR and the RGB light bar. The LCD shows the
# ESPHome test card; this file intentionally carries no UI.
---
substitutions:
  name: stackchan
  friendly_name: M5Stack StackChan

  # Head servos: travel in degrees over the full 0..1023 step range and the
  # step that reads 0°. Override locally, or record the current pose with the
  # "Servo Calibration" button.
  servo_x_range: "380"
  servo_x_zero_position: "476"
  servo_y_range: "334"
  servo_y_zero_position: "624"

  # Normal moves release the torque when the servo reports the move finished;
  # this delay is the boot fallback for releasing the head.
  servo_release_delay: "1s"
  servo_feedback_interval: "100ms"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: m5stack.stackchan-bsp
    version: 2026.11.0
  min_version: 2026.11.0
  name_add_mac_suffix: true
  on_boot:
    # The body sits on the 5 V BUS, which the expander holds low until
    # `bus_power_on` runs. It must come up after the expander pins are parked
    # (HARDWARE, 800) and before the body devices are probed (DATA, 600).
    - priority: 700
      then:
        - script.execute: bus_power_on

    # The restoring globals load at HARDWARE (800) and the servos come up at
    # DATA (600), so the stored zero is applied in between.
    - priority: 650
      then:
        - lambda: |-
            id(x_servo)->set_zero_position(id(servo_x_zero_step));
            id(y_servo)->set_zero_position(id(servo_y_zero_step));

    - priority: 600
      then:
        # Seed the system clock from the RTC before the network is up.
        - bm8563.read_time:

    - priority: 500
      then:
        # Light the panel only after the display and touch drivers have run
        # their setup(), so the backlight never comes up over an uninitialised
        # panel.
        - light.turn_on:
            id: lcd_backlight
            brightness: 80%

    - priority: -100
      then:
        # The servos come up holding their pose; release the torque once the
        # bus and the servo firmware are ready.
        - delay: ${servo_release_delay}
        - ftservo.set_torque:
            id: x_servo
            enabled: false
        - ftservo.set_torque:
            id: y_servo
            enabled: false

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  flash_mode: qio
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic

psram:
  mode: quad
  speed: 80MHz

api:

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:

improv_serial:

improv_ble:
  authorizer: none

captive_portal:

network:
  enable_high_performance: true

logger:
  level: DEBUG

# Runtime diagnostics, published through the `debug` sensors below.
debug:
  update_interval: 60s

i2c:
  - id: bsp_bus
    sda: GPIO12
    scl: GPIO11
    frequency: 100kHz
# PORT.A (GPIO2/GPIO1) is not claimed: GPIO2 is the camera's virtual XCLK.

spi:
  - id: spi_bus
    clk_pin: GPIO36
    mosi_pin: GPIO37

# SCS9009 servo bus
uart:
  id: servo_uart
  tx_pin: GPIO6
  rx_pin: GPIO7
  baud_rate: 1000000

i2s_audio:
  id: i2s_audio_bus
  i2s_lrclk_pin: GPIO33
  i2s_bclk_pin: GPIO34
  i2s_mclk_pin:
    number: GPIO0
    ignore_strapping_warning: true

external_components:
  # PMIC and the regulator platform the power rails are configured with
  - source: github://m5stack/esphome@feat-axp
    components: [axp_base, axp2101, regulator]
    refresh: 0s

  - source: github://m5stack/esphome@feat-aw9523b
    components: [aw9523b]
    refresh: 0s

  # AW88298 audio amplifier
  - source: github://m5stack/esphome@feat-awinic-amp
    components: [aw88298]
    refresh: 0s

  # StackChan body: IO expander, servos, head touch and NFC
  - source: github://m5stack/esphome@feat-m5ioe1
    components: [m5stack_ioe1]
    refresh: 0s

  - source: github://m5stack/esphome@feat-ftservo
    components: [ftservo, scs9009]
    refresh: 0s

  - source: github://m5stack/esphome@feat-si12t
    components: [si12t]
    refresh: 0s

  - source: github://m5stack/esphome@feat-st25r3916
    components: [st25r, st25r_i2c]
    refresh: 0s

axp2101:
  id: axp2101_pmu
  i2c_id: bsp_bus
  update_interval: 30s
  event_poll_interval: 100ms

# Power rails of the PMIC. `always_on` implies `boot_on`, so each rail is set
# to its voltage and switched on during setup(), before any DATA component is
# probed.
regulator:
  - platform: axp2101
    axp_id: axp2101_pmu
    always_on: true
    rails:
      - id: rail_aldo1
        rail: ALDO1
        voltage: 1800mV   # AW88298 DVDD
      - id: rail_aldo2
        rail: ALDO2
        voltage: 3300mV   # ES7210 / AW88298 PVDD
      - id: rail_aldo3
        rail: ALDO3
        voltage: 3300mV   # camera module + LTR-553
      - id: rail_aldo4
        rail: ALDO4
        voltage: 3300mV   # TF card slot
      - id: rail_bldo1
        rail: BLDO1
        voltage: 2800mV   # camera AVDD
      - id: rail_bldo2
        rail: BLDO2
        voltage: 1500mV   # camera DVDD

aw9523b:
  id: aw9523b_hub
  i2c_id: bsp_bus
  p0_drive_mode: PUSH_PULL
  interrupt_pin: GPIO21

motion:
  - platform: bmi270
    id: imu
    i2c_id: bsp_bus
    address: 0x69
    update_interval: 50ms
    accelerometer_range: 4G
    accelerometer_odr: 100HZ
    gyroscope_range: 1000DPS
    gyroscope_odr: 200HZ
    # The BMM150 magnetometer sits behind the BMI270's aux interface. Enable
    # `aux_device: BMM150` and the magnetic field sensors below to use it.
    # aux_device: BMM150

# --- StackChan body ----------------------------------------------------------
# Body IO expander (PY32L020): RGB light bar and the servo power switch.
m5stack_ioe1:
  id: m5stack_ioe1_hub
  i2c_id: bsp_bus
  reset: true

# Three-zone head touch panel
si12t:
  id: touch_hub
  i2c_id: bsp_bus
  update_interval: 50ms

# NFC reader (ST25R3916 on the body I2C bus, address 0x50)
st25r_i2c:
  id: nfc_reader
  i2c_id: bsp_bus
  on_tag:
    then:
      - logger.log:
          format: "NFC tag: %s (%s)"
          args: [x.c_str(), tag.get_tag_type().c_str()]
      - text_sensor.template.publish:
          id: nfc_tag
          state: !lambda 'return x;'
  on_tag_removed:
    then:
      - text_sensor.template.publish:
          id: nfc_tag
          state: ""

# SCS9009 serial bus servos
scs9009:
  id: scs9009_hub
  uart_id: servo_uart
  timeout: 100ms
  min_interval: 5ms

ftservo:
  - platform: scs9009
    id: x_servo
    scs9009_id: scs9009_hub
    address: 1
    range: ${servo_x_range}
    zero_position: ${servo_x_zero_position}
    default_time: 600
    release_after_move: true
    update_interval: ${servo_feedback_interval}
    # A stalled move never reaches the move-done path, so release the torque
    # here instead of pushing against the obstacle.
    on_error:
      - lambda: |-
          if (code & esphome::ftservo::SERVO_ERROR_STALLED)
            id(x_servo)->set_torque(false);

  - platform: scs9009
    id: y_servo
    scs9009_id: scs9009_hub
    address: 2
    range: ${servo_y_range}
    zero_position: ${servo_y_zero_position}
    default_time: 600
    release_after_move: true
    update_interval: ${servo_feedback_interval}
    on_error:
      - lambda: |-
          if (code & esphome::ftservo::SERVO_ERROR_STALLED)
            id(y_servo)->set_torque(false);

output:
  # DLDO1: LCD backlight
  - platform: axp2101
    id: lcd_backlight_output
    rail: DLDO1
    min_voltage: 2600
    max_voltage: 3300

# --- 5 V power path ----------------------------------------------------------
# The body (servos, touch, NFC, light bar) is powered from the 5 V BUS. The
# boot script below is the only power path: boost on, bus precharged, bus
# switch closed.
script:
  - id: bus_power_on
    then:
      - lambda: |-
          // A converter under-voltage latches the AXP2101 off until the power
          // key is pressed, and the BUS is a capacitive load, so the latch is
          // cleared before the boost is switched onto it.
          if (const auto *uvp = id(axp2101_pmu)->find_flag("dcdc_uvp_shutdown"); uvp != nullptr)
            id(axp2101_pmu)->write_flag(*uvp, false);

          id(boost_en)->turn_on();
          delay(50);

          // Eight pulses of growing on-time bring the cold body rail up to a
          // few volts before it is switched on for good.
          for (int pulse = 0; pulse < 8; ++pulse) {
            id(bus_out_en)->turn_on();
            delayMicroseconds(pulse * 16);
            id(bus_out_en)->turn_off();
            delayMicroseconds(1000);
          }
          id(bus_out_en)->turn_on();
          delay(100);

switch:
  # Power path actuators (AW9523B). The boot script owns the sequencing, so
  # these pins stay internal and never restore on their own.
  - platform: gpio
    id: boost_en
    pin:
      aw9523b_id: aw9523b_hub
      number: 15          # P1_7: SY7088 boost (BUS_5V)
    internal: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: bus_out_en
    pin:
      aw9523b_id: aw9523b_hub
      number: 1           # P0_1: BUS_5V -> BUS_OUT
    internal: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: usb_otg_en
    pin:
      aw9523b_id: aw9523b_hub
      number: 5           # P0_5: BUS_5V -> VUSB
    internal: true
    restore_mode: ALWAYS_OFF

  # PMIC settings
  - platform: axp2101
    charging:
      name: "Charging"
    gauge:
      name: "Fuel Gauge"
      restore_mode: ALWAYS_ON
    # The TS pin senses the BUS rail instead of a battery thermistor.
    ts_external_input:
      name: "TS External Input"
      restore_mode: ALWAYS_ON

  # AW88298 runtime settings, reported from the chip's current state.
  - platform: aw88298
    hdcc:
      name: "Amplifier HDCC"
    agc:
      name: "Amplifier AGC"
    agc_rms:
      name: "Amplifier AGC RMS"
    input_attenuation:
      name: "Amplifier Input Attenuation"
    receiver_mode:
      name: "Amplifier Receiver Mode"

  # Camera module enable / reset (P1_0), active high.
  - platform: gpio
    name: "Camera Reset"
    pin:
      aw9523b_id: aw9523b_hub
      number: 8
    internal: true
    restore_mode: RESTORE_DEFAULT_ON

  # Body IO1: servo VM enable
  - platform: gpio
    name: "Servo Power"
    icon: mdi:electric-switch
    pin:
      m5stack_ioe1_id: m5stack_ioe1_hub
      number: 0
      mode:
        output: true
        pullup: true
    restore_mode: RESTORE_DEFAULT_ON

binary_sensor:
  - platform: gpio
    name: "ES7210 Interrupt"
    pin:
      aw9523b_id: aw9523b_hub
      number: 3
      inverted: true

  - platform: gpio
    name: "SDCard Interrupt"
    pin:
      aw9523b_id: aw9523b_hub
      number: 4
      inverted: true

  - platform: gpio
    name: "AW88298 Interrupt"
    pin:
      aw9523b_id: aw9523b_hub
      number: 11
      inverted: true

  # AW88298 status bits (SYSST), plus the combined fault state
  - platform: aw88298
    fault:
      name: "Amplifier Fault"
    clipping:
      name: "Amplifier Clipping"
    pre_clipping:
      name: "Amplifier Pre-Clipping"
    over_temperature:
      name: "Amplifier Over Temperature"
    over_current:
      name: "Amplifier Over Current"
    under_voltage:
      name: "Amplifier Under Voltage"
    no_clock:
      name: "Amplifier No Clock"
    clock_stable:
      name: "Amplifier Clock Stable"
    pll_locked:
      name: "Amplifier PLL Locked"
    amplifier_switching:
      name: "Amplifier Switching"
    boost_started:
      name: "Amplifier Boost Started"
    boost_adaptive:
      name: "Amplifier Boost Adaptive"
    boost_over_current:
      name: "Amplifier Boost Over Current"
    boost_over_voltage:
      name: "Amplifier Boost Over Voltage"
    boost_over_voltage_2:
      name: "Amplifier Boost Over Voltage 2"

  # PMIC status bits
  - platform: axp2101
    battery_charging:
      name: "Battery Charging"
    battery_discharging:
      name: "Battery Discharging"
    vbus_good:
      name: "VBUS Good"
    battery_present:
      name: "Battery Present"
      entity_category: diagnostic

  # BMI270 motion detectors
  - platform: motion
    type: moving
    name: "IMU Moving"

  - platform: motion
    type: free_fall
    name: "IMU Free Fall"

  - platform: motion
    type: face_up
    name: "IMU Face Up"

  - platform: motion
    type: face_down
    name: "IMU Face Down"

# RTC (BM8563). The time is written once Home Assistant syncs, and read back at
# boot so the clock survives a power cycle.
time:
  - platform: bm8563
    id: rtc
    i2c_id: bsp_bus
    update_interval: never

  - platform: homeassistant
    on_time_sync:
      then:
        - bm8563.write_time:

sensor:
  # --- StackChan body --------------------------------------------------------
  - platform: ftservo
    ftservo_id: x_servo
    position:
      id: servo_x_position
      name: "Servo X Position"
      filters:
        - delta: 3.0

  - platform: ftservo
    ftservo_id: y_servo
    position:
      id: servo_y_position
      name: "Servo Y Position"
      filters:
        - delta: 3.0

  # Battery monitor of the robot body
  - platform: ina226
    i2c_id: bsp_bus
    address: 0x41
    shunt_resistance: 0.01 ohm
    max_current: 3.2A
    adc_time: 140us
    adc_averaging: 128
    update_interval: 60s
    current:
      name: "INA226 Current"
    power:
      name: "INA226 Power"
    bus_voltage:
      name: "INA226 Bus Voltage"
    shunt_voltage:
      name: "INA226 Shunt Voltage"

  # --- CoreS3 base -----------------------------------------------------------
  - platform: axp2101
    battery_voltage:
      name: "Battery Voltage"
    battery_level:
      name: "Battery Level"
    vbus_voltage:
      name: "VBUS Voltage"
    system_voltage:
      name: "System Voltage"
    die_temperature:
      name: "AXP2101 Temperature"

  # BMI270 accelerometer / tilt
  - platform: motion
    type: acceleration_x
    name: "IMU Acceleration X"

  - platform: motion
    type: acceleration_y
    name: "IMU Acceleration Y"

  - platform: motion
    type: acceleration_z
    name: "IMU Acceleration Z"

  - platform: motion
    type: pitch
    name: "IMU Pitch"

  - platform: motion
    type: roll
    name: "IMU Roll"

  - platform: motion
    type: gyroscope_x
    name: "IMU Gyroscope X"

  - platform: motion
    type: gyroscope_y
    name: "IMU Gyroscope Y"

  - platform: motion
    type: gyroscope_z
    name: "IMU Gyroscope Z"

  # Which side faces up, in 90° steps (NaN while the board lies flat).
  - platform: motion
    type: orientation
    name: "IMU Orientation"
    flat_threshold: 30.0

  - platform: bmi270
    type: temperature
    name: "IMU Temperature"

  # BMM150 magnetometer behind the BMI270's aux interface; enable together
  # with `motion.aux_device: BMM150`.
  # - platform: bmi270
  #   type: magnetic_field_x
  #   name: "Magnetic Field X"
  #
  # - platform: bmi270
  #   type: magnetic_field_y
  #   name: "Magnetic Field Y"
  #
  # - platform: bmi270
  #   type: magnetic_field_z
  #   name: "Magnetic Field Z"

  # LTR-553ALS-WA: ambient light + proximity, on the camera flex cable
  - platform: ltr_als_ps
    i2c_id: bsp_bus
    address: 0x23
    type: ALS_PS
    ambient_light:
      name: "Ambient Light"
    ps_counts:
      name: "Proximity Counts"
    glass_attenuation_factor: 2.5
    auto_mode: true
    ps_cooldown: 5s
    ps_high_threshold: 500

  # AW88298 measurements, polled by the amplifier itself
  - platform: aw88298
    die_temperature:
      name: "Amplifier Temperature"
    supply_voltage:
      name: "Amplifier Supply"
    amplifier_voltage:
      name: "Amplifier Output"
    boost_voltage:
      name: "Amplifier Boost Output"

  # ESPHome runtime diagnostics, bytes converted to kB
  - platform: debug
    free:
      name: "Free Heap"
      unit_of_measurement: kB
      accuracy_decimals: 1
      filters:
        - multiply: 0.0009765625
    block:
      name: "Largest Free Heap Block"
      unit_of_measurement: kB
      accuracy_decimals: 1
      filters:
        - multiply: 0.0009765625
    min_free:
      name: "Minimum Free Heap"
      unit_of_measurement: kB
      accuracy_decimals: 1
      filters:
        - multiply: 0.0009765625
    psram:
      name: "Free PSRAM"
      unit_of_measurement: kB
      accuracy_decimals: 1
      filters:
        - multiply: 0.0009765625
    fragmentation:
      name: "Heap Fragmentation"
    loop_time:
      name: "Loop Time"

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "LCD Backlight"
    icon: "mdi:television"
    output: lcd_backlight_output
    # Stays dark through setup() on purpose: the boot trigger turns it on after
    # the panel is initialised.
    restore_mode: ALWAYS_OFF
    default_transition_length: 250ms

  # 12 RGB LEDs of the StackChan body, driven through the body IO expander
  - platform: m5stack_ioe1
    id: stackchan_light_bar
    name: "StackChan Light Bar"
    icon: mdi:led-strip
    num_leds: 12
    restore_mode: ALWAYS_OFF
    gamma_correct: 2.8
    default_transition_length: 1s
    flash_transition_length: 0s
    effects:
      - random:
          name: "Random"
          transition_length: 1s
          update_interval: 1s
      - addressable_rainbow:
          name: "Rainbow"
          speed: 10
          width: 50
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 5%
          progress_interval: 4ms

event:
  - platform: axp2101
    name: "PMU Event"
    events:
      - vbus_insert
      - vbus_remove
      - battery_insert
      - battery_remove
      - power_key_short_press
      - power_key_long_press
      - charge_started
      - charge_done
    on_event:
      - logger.log:
          format: "AXP2101 event: %s"
          args: [event_type.c_str()]

  # Shake gesture; the assembled body is heavier than a bare CoreS3.
  - platform: motion
    name: "IMU Shake"
    threshold: 1.5
    cooldown: 500ms

button:
  - platform: template
    name: "Power Off"
    icon: "mdi:power"
    entity_category: config
    on_press:
      - axp2101.shutdown: axp2101_pmu

  - platform: template
    name: "Restart SoC"
    icon: "mdi:restart"
    entity_category: config
    on_press:
      - axp2101.restart: axp2101_pmu

  - platform: template
    name: "Reset Fuel Gauge"
    icon: "mdi:battery-sync"
    entity_category: config
    on_press:
      - axp2101.reset_gauge: axp2101_pmu

  # Records the pose the head is in as 0° on both axes and stores it in flash.
  - platform: template
    name: "Servo Calibration"
    icon: "mdi:crosshairs-gps"
    entity_category: config
    on_press:
      - lambda: |-
          if (id(x_servo)->is_moving() || id(y_servo)->is_moving()) {
            ESP_LOGW("servo_cal", "Head is moving, calibration skipped");
            return;
          }
          if (!id(x_servo)->has_feedback() || !id(y_servo)->has_feedback()) {
            ESP_LOGW("servo_cal", "No position feedback yet, calibration skipped");
            return;
          }
          const uint16_t x = id(x_servo)->feedback().position;
          const uint16_t y = id(y_servo)->feedback().position;
          id(x_servo)->set_zero_position(x);
          id(y_servo)->set_zero_position(y);
          id(servo_x_zero_step) = x;
          id(servo_y_zero_step) = y;
          ESP_LOGI("servo_cal", "Zero position recorded at x=%u, y=%u",
                   static_cast<unsigned>(x), static_cast<unsigned>(y));
      # The globals queue their save on their own poll; flush it here so the
      # calibration survives a power cut.
      - delay: 1s
      - lambda: global_preferences->sync();

  # Drops the stored calibration and returns to the substitution values.
  - platform: template
    name: "Clear Calibration"
    icon: "mdi:crosshairs-off"
    entity_category: config
    on_press:
      - lambda: |-
          id(servo_x_zero_step) = ${servo_x_zero_position};
          id(servo_y_zero_step) = ${servo_y_zero_position};
          id(x_servo)->set_zero_position(id(servo_x_zero_step));
          id(y_servo)->set_zero_position(id(servo_y_zero_step));
      - delay: 1s
      - lambda: global_preferences->sync();

select:
  # These run their setup() at HARDWARE priority, before the charger is allowed
  # to start; the charge-voltage register is not reliably at its default after
  # power-on.
  - platform: axp2101
    charge_current:
      name: "Charge Current"
    charge_voltage:
      name: "Charge Voltage"
      initial_option: 4.1V
    input_current_limit:
      name: "Input Current Limit"
    power_key_long_press:
      name: "Power Key Long Press"

  # AW88298 runtime settings
  - platform: aw88298
    boost_mode:
      name: "Amplifier Boost Mode"
    boost_deglitch:
      name: "Amplifier Boost Deglitch"

number:
  - platform: aw88298
    boost_voltage:
      name: "Amplifier Boost Target"
    boost_current_limit:
      name: "Amplifier Boost Current Limit"
    boost_attack_threshold:
      name: "Amplifier Boost Attack Threshold"
    boost_release_threshold:
      name: "Amplifier Boost Release Threshold"
    agc_attack_threshold:
      name: "Amplifier AGC Attack Threshold"
    agc_release_threshold:
      name: "Amplifier AGC Release Threshold"
    agc_attack_time:
      name: "Amplifier AGC Attack Time"
    agc_release_time:
      name: "Amplifier AGC Release Time"
    agc_hold_time:
      name: "Amplifier AGC Hold Time"

  # --- StackChan servos ------------------------------------------------------
  - platform: ftservo
    ftservo_id: x_servo
    angle:
      id: servo_x_angle
      name: "Servo X Angle"
      min_value: -164
      max_value: 164
      step: 5
    speed:
      id: servo_x_speed
      name: "Servo X Speed"
      min_value: 100
      max_value: 1000
      step: 100

  - platform: ftservo
    ftservo_id: y_servo
    angle:
      id: servo_y_angle
      name: "Servo Y Angle"
      min_value: 0
      max_value: 90
      step: 5
    speed:
      id: servo_y_speed
      name: "Servo Y Speed"
      min_value: 100
      max_value: 1000
      step: 100

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    bits_per_sample: 16bit
    sample_rate: 48000
    mic_gain: 36

audio_dac:
  - platform: aw88298
    id: aw88298_dac
    i2c_id: bsp_bus
    address: 0x36
    # RSTN is active low and sits on the IO expander.
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 2
    sample_rate: 48000
    bits_per_sample: 16bit
    i2s_format: i2s
    i2s_channel: left
    slot_bits: 16
    slot_count: 2
    ws_pulse: slot
    # HDCC removes the DC offset; AGC can be turned on at runtime.
    hdcc: true
    input_attenuation: false
    volume_min_db: -96dB
    volume_max_db: 0dB
    initial_volume: 100%
    update_interval: 60s
    # Feed-forward boost, matching M5's esp_codec_dev setup.
    boost:
      mode: smart_boost_2
      voltage: 5.0V
      current_limit: 3.5A
      deglitch: 21.3ms
      attack_threshold: 30%
      release_threshold: 15%

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO14
    adc_type: external
    sample_rate: 48000
    bits_per_sample: 16bit

speaker:
  # Hardware output: AW88298 over I2S
  - platform: i2s_audio
    id: hw_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO13
    dac_type: external
    audio_dac: aw88298_dac
    sample_rate: 48000
    bits_per_sample: 16bit

  - platform: mixer
    id: audio_mixer
    output_speaker: hw_speaker
    num_channels: 1
    bits_per_sample: 16
    task_stack_in_psram: true
    source_speakers:
      - id: media_speaker_mix       # Music/radio streams (duckable)
        timeout: 10s
        buffer_duration: 100ms
      - id: tts_speaker_mix         # TTS announcements (never ducked)
        timeout: 10s
        buffer_duration: 100ms

  - platform: resampler
    id: media_speaker              # Music/radio -> 48kHz
    output_speaker: media_speaker_mix
    task_stack_in_psram: true

  - platform: resampler
    id: tts_speaker                # TTS -> 48kHz
    output_speaker: tts_speaker_mix
    task_stack_in_psram: true

media_player:
  - platform: speaker
    name: "StackChan Speaker"
    id: speaker_media_player
    task_stack_in_psram: true
    media_pipeline:
      speaker: media_speaker
      sample_rate: 48000
      format: FLAC
    announcement_pipeline:
      speaker: tts_speaker
      format: FLAC
      sample_rate: 48000

display:
  - platform: mipi_spi
    model: M5CORE
    dc_pin: GPIO35
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 9
    cs_pin:
      number: GPIO3
      ignore_strapping_warning: true
    show_test_card: true
    data_rate: 40MHz
    invert_colors: true

touchscreen:
  - platform: ft63x6
    id: touch
    i2c_id: bsp_bus
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 0
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 240

esp32_camera:
  name: "Camera"
  icon: "mdi:camera"
  i2c_id: bsp_bus
  vsync_pin:
    number: GPIO46
    ignore_strapping_warning: true
  href_pin: GPIO38
  external_clock:
    # Virtual pin: the module is clocked by its own 20 MHz oscillator, but
    # esp32_camera still requires a pin for the XCLK output.
    pin: GPIO2
    frequency: 20MHz
  pixel_clock_pin:
    number: GPIO45
    ignore_strapping_warning: true
  data_pins: [GPIO39, GPIO40, GPIO41, GPIO42, GPIO15, GPIO16, GPIO48, GPIO47] # D0-D7
  resolution: 640x480
  # A VGA frame is converted in software on the main loop; 2 fps leaves roughly
  # half the loop for audio/API.
  max_framerate: 2.0 fps
  frame_buffer_count: 1
  frame_buffer_location: PSRAM
  pixel_format: RGB565
  jpeg_quality: 20
  brightness: 1
  contrast: 1
  saturation: 0
  wb_mode: AUTO
  special_effect: NONE
  # Exposure and gain are tuned on this module; AUTO would re-converge after
  # any scene change.
  aec_mode: manual
  aec_value: 800
  agc_mode: manual
  agc_value: 30

# --- StackChan body: IR ------------------------------------------------------
remote_transmitter:
  id: ir_tx
  pin: GPIO5
  carrier_duty_percent: 50%
  non_blocking: true

remote_receiver:
  id: ir_rx
  pin: GPIO10

# Example IR climate entity, replace with your own device.
climate:
  - platform: coolix
    name: "Default AC"
    visual:
      min_temperature: 18
      max_temperature: 30
      temperature_step: 1

# Expose the raw IR timings to Home Assistant to learn and replay codes.
infrared:
  - platform: ir_rf_proxy
    name: "IR Proxy Transmitter"
    id: ir_proxy_tx
    remote_transmitter_id: ir_tx
  - platform: ir_rf_proxy
    name: "IR Proxy Receiver"
    id: ir_proxy_rx
    remote_receiver_id: ir_rx

# --- StackChan body: touch and NFC -------------------------------------------
text_sensor:
  # Si12T levels of the three head zones, tuned for this body.
  - platform: si12t
    id: head_touch_left
    name: "Touch Sensor 1"
    channel: 1
    sensitivity: 3
    high_sensitivity: false

  - platform: si12t
    id: head_touch_middle
    name: "Touch Sensor 2"
    channel: 2
    sensitivity: 3
    high_sensitivity: false

  - platform: si12t
    id: head_touch_right
    name: "Touch Sensor 3"
    channel: 3
    sensitivity: 3
    high_sensitivity: false

  - platform: template
    id: nfc_tag
    name: "NFC Tag"
    icon: mdi:nfc

globals:
  # Servo zero in steps, written by "Servo Calibration" and applied on boot.
  - id: servo_x_zero_step
    type: uint16_t
    restore_value: yes
    initial_value: ${servo_x_zero_position}
  - id: servo_y_zero_step
    type: uint16_t
    restore_value: yes
    initial_value: ${servo_y_zero_position}
