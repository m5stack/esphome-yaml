---
substitutions:
  name: stackchan-voice
  friendly_name: M5Stack StackChan Voice Assistant

  # Audio files
  wake_word_triggered_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
  timer_finished_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
  error_cloud_expired_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/error_cloud_expired.mp3

  # Micro wake word models
  hi_stackchan_model_file: "https://github.com/m5stack/esphome-yaml/releases/download/2026.3.0/hi_stackchan.json"
  okay_nabu_model_file: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json

  # Phases of the Voice Assistant
  # The voice assistant is ready to be triggered by a wake word
  voice_assist_idle_phase_id: "1"
  # The voice assistant is listening for a voice command
  voice_assist_listening_phase_id: "2"
  # The voice assistant is currently processing the command
  voice_assist_thinking_phase_id: "3"
  # The voice assistant is replying to the command
  voice_assist_replying_phase_id: "4"
  # The voice assistant is not ready
  voice_assist_not_ready_phase_id: "10"
  # The voice assistant encountered an error
  voice_assist_error_phase_id: "11"
  # Muted phase
  voice_assist_muted_phase_id: "12"

  # Add support for non-unicode characters by using better glyphs
  font_glyphsets: "GF_Latin_Core"
  # for Greek use "Noto Sans" for other languages use a compatible font family
  font_family: Figtree

  # Head servos: the mechanical description of each axis. `range` is the travel
  # in degrees over the servo's full 0..1023 step range and `zero_position` the
  # step that reads 0°, so one step is `range / 1024` degrees.
  # The pitch numbers are measured on this unit: 0° at step 624 and 90° at step
  # 900, i.e. 276 steps per 90° → 334° per 1024 steps. Firmware assumes
  # the nominal 0.3125°/step (range 320) for both axes with 620 as the pitch
  # zero, so a measurement landing within a few percent of that is expected; the
  # yaw below still carries the old BSP formula and is worth measuring the same
  # way (step at 0° and at ±90°) before trusting its reported angle.
  # Override them in a local config if the assembly puts the head at a
  # different zero, or use the "Servo Calibration" button: it records the pose
  # the head is in as 0° on both axes and stores it in flash, so these
  # substitutions are only the value a freshly flashed device starts from.
  servo_x_range: "380"
  servo_x_zero_position: "476"
  servo_y_range: "334"
  servo_y_zero_position: "624"

  # Normal moves release torque when the servo reports the move finished
  # (release_after_move). This delay is the fallback used by the boot and
  # stall release path before it disables the torque.
  servo_release_delay: "1s"

  # How often each servo reports its position.
  servo_feedback_interval: "100ms"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.11.0
  name_add_mac_suffix: true
  on_boot:
    # The AFE feed task runs one priority step above loopTask (6 vs 5) so a
    # 64 ms AFE block is never preempted mid-deadline. Raise loopTask off the
    # ESPHome default of 1 so afe_feed can never starve it into a task watchdog.
    - priority: 800
      then:
        - lambda: |-
            const TaskHandle_t task = xTaskGetCurrentTaskHandle();
            const char *name = pcTaskGetName(task);
            if (name == nullptr || std::string(name) != "loopTask" || xPortGetCoreID() != 1) {
              ESP_LOGE("afe_boot", "Unexpected boot task %s on core %d; priority unchanged",
                       name == nullptr ? "<null>" : name, xPortGetCoreID());
              return;
            }
            vTaskPrioritySet(task, 5);
            const UBaseType_t priority = uxTaskPriorityGet(task);
            if (priority != 5) {
              ESP_LOGE("afe_boot", "Failed to set loopTask priority: %u", static_cast<unsigned>(priority));
              return;
            }
            ESP_LOGI("afe_boot", "loopTask core=%d priority=%u", xPortGetCoreID(), static_cast<unsigned>(priority));
    # The body sits on the 5 V BUS, which the expander holds low until
    # `bus_power_on` runs, so si12t and st25r would be probed on a dead bus and
    # marked failed for the rest of the boot. This runs after the expander's
    # output switches have parked the pins low (HARDWARE, 800) and before the
    # first component that talks to a body device (DATA, 600).
    - priority: 700
      then:
        - script.execute: bus_power_on

    # The calibrated zero has to be on the servos before their own setup() logs
    # the model. The restoring globals load it at HARDWARE (800), the servos come
    # up at DATA (600), so this slot is the last point where it is still ahead of
    # every angle calculation.
    - priority: 650
      then:
        - lambda: |-
            id(x_servo)->set_zero_position(id(servo_x_zero_step));
            id(y_servo)->set_zero_position(id(servo_y_zero_step));

    - priority: 600
      then:
        - light.turn_on:
            id: lcd_backlight
            brightness: 80%

    - priority: 100
      then:
        - delay: 200ms
        - script.execute: draw_display
        - delay: 30s
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: draw_display

    # The servos come up holding their own pose, so the head would be stiff
    # until the first move. Release it once here, after the bus and the servo
    # firmware had the time they need to be ready; every later release comes
    # from `release_after_move`, so this is the only other place that touches
    # the torque.
    - priority: -100
      then:
        - delay: ${servo_release_delay}
        - ftservo.set_torque:
            id: x_servo
            enabled: false
        - ftservo.set_torque:
            id: y_servo
            enabled: false

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  flash_mode: qio
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic    
    ## Note: Disable these configurations if you face the boot loop issue.
    sdkconfig_options:
      # 64 KB data cache, 64 byte cache lines and a 32 KB instruction cache
      # reduce PSRAM access latency for mWW.
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Execute code and read-only data from PSRAM: frees internal SRAM and
      # lets instructions run during flash operations. Speeds up mWW at the
      # cost of PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      # Keep Bluetooth and mbedTLS buffers out of internal SRAM as well.
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

psram:
  mode: quad
  speed: 80MHz

# Enable Home Assistant API
api:
  on_client_connected:
    - script.execute: draw_display
  on_client_disconnected:
    - script.execute: draw_display
  actions:
    - action: stackchan_set_emotion
      variables:
        emotion: string
      then:
        - stackchan_ui.set_emotion:
            id: stackchan_face
            emotion: !lambda return emotion;
    - action: stackchan_say
      variables:
        message: string
      then:
        # `speak` drives the mouth; the draw_display status text leaves it
        # off so only an explicit say animates the mouth.
        - stackchan_ui.set_speech:
            id: stackchan_face
            text: !lambda return message;
            duration: 8s
            speak: true
    - action: stackchan_pet
      then:
        - stackchan_ui.head_pet: stackchan_face
    - action: stackchan_shake
      then:
        - stackchan_ui.shake: stackchan_face

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
  on_connect:
    - script.execute: draw_display
  on_disconnect:
    - script.execute: draw_display      

network:
  enable_high_performance: true

captive_portal:

# Enable logging
logger:
  level: DEBUG

globals:
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: "true"
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  # Shared animation cursor so switching effects does not jump the pattern.
  - id: led_animation_index
    type: int
    restore_value: no
    initial_value: "0"
  # Servo zero in steps, written by the "Servo Calibration" button and applied
  # to the servos on boot. A device that was never calibrated has no stored
  # value and starts from the `servo_*_zero_position` substitutions.
  - id: servo_x_zero_step
    type: uint16_t
    restore_value: yes
    initial_value: ${servo_x_zero_position}
  - id: servo_y_zero_step
    type: uint16_t
    restore_value: yes
    initial_value: ${servo_y_zero_position}
  # StackChan head touch gesture state: 0 idle, 1 touched, 2 swiping.
  # The position is the intensity-weighted position across the three Si12T
  # channels, in the same -100..100 range as the original firmware.
  - id: head_touch_state
    type: int
    restore_value: no
    initial_value: "0"
  - id: head_touch_initial_position
    type: int
    restore_value: no
    initial_value: "0"
  - id: head_touch_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  # Set when a pet nudge actually moved the pitch; the 3 s restore callback
  # only homes the pitch in that case.
  - id: head_pet_moved
    type: bool
    restore_value: no
    initial_value: "false"

i2c:
  - id: bsp_bus
    sda: GPIO12
    scl: GPIO11
    frequency: 100kHz
  - id: ext_bus
    sda: GPIO2
    scl: GPIO1

spi:
  - id: spi_bus
    clk_pin: GPIO36
    mosi_pin: GPIO37

uart:
  id: servo_uart
  tx_pin: GPIO6
  rx_pin: GPIO7
  baud_rate: 1000000

external_components:
  # feat-axp: axp_base + the rewritten axp2101 driver + `regulator`, the
  # provider platform the power rails are configured with. Neither axp_base nor
  # regulator is in the 2026.11 release, so the PMIC has to come from this
  # branch, which is also why m5-dev no longer lists axp2101.
  - source: github://m5stack/esphome@feat-axp
    components: [axp_base, axp2101, regulator]
    refresh: 0s
  - source: github://m5stack/esphome@feat-aw9523b
    components: [aw9523b]
    refresh: 0s
  # feat-m5ioe1: the IO expander of the StackChan body (PY32L020), as
  # `m5stack_ioe1`. It sits on the cached gpio_expander base with interrupt
  # support, and the light platform reports RGB instead of a per-channel view.
  - source: github://m5stack/esphome@feat-m5ioe1
    components: [m5stack_ioe1]
    refresh: 0s
  # feat-ftservo: the rewritten servo stack.
  - source: github://m5stack/esphome@feat-ftservo
    components: [ftservo, scs9009, stackchan_motion]
    refresh: 0s
  # audio component
  - source: github://n-IA-hane/esphome-audio-stack@v2026.11.1-dev
    components: [esp_audio_stack, esp_afe]
    refresh: 1h
  # Touch support
  - source: github://m5stack/esphome@feat-si12t
    components: [si12t]
    refresh: 0s
  # NFC reader support
  - source: github://m5stack/esphome@feat-st25r3916
    components: [st25r, st25r_i2c]
    refresh: 0s
  # feat-m5-ui: the LVGL StackChan face and behaviour library.
  - source: github://m5stack/esphome@feat-m5-ui
    components: [stackchan_ui]
    refresh: 0s

# PMU
axp2101:
  id: axp2101_pmu
  i2c_id: bsp_bus
  update_interval: 30s
  event_poll_interval: 100ms

# Power rails of the PMIC, as regulators. `always_on` implies `boot_on`, so each
# rail is set to its voltage and switched on during setup(), before any DATA
# component is probed, and nothing may switch it off afterwards.
regulator:
  - platform: axp2101
    axp_id: axp2101_pmu
    always_on: true
    rails:
      - id: rail_aldo1
        rail: ALDO1
        voltage: 1800mV
      - id: rail_aldo2
        rail: ALDO2
        voltage: 3300mV
      - id: rail_bldo1
        rail: BLDO1
        voltage: 2800mV
      - id: rail_bldo2
        rail: BLDO2
        voltage: 1500mV
      - id: rail_dcdc1
        rail: DCDC1
        voltage: 3300mV
      - id: rail_dcdc3
        rail: DCDC3
        voltage: 3300mV

# IO Expander
aw9523b:
  id: aw9523b_hub
  i2c_id: bsp_bus
  p0_drive_mode: PUSH_PULL
  interrupt_pin: GPIO21

# BMI270 on the internal I2C bus.
motion:
  - platform: bmi270
    id: imu
    i2c_id: bsp_bus
    address: 0x69
    update_interval: 50ms
    accelerometer_range: 4G
    accelerometer_odr: 100HZ
    gyroscope_range: 1000DPS
    gyroscope_odr: 200HZ

output:
  # DLDO1: LCD backlight
  - platform: axp2101
    id: lcd_backlight_output
    rail: DLDO1
    min_voltage: 2600
    max_voltage: 3300

# StackChan body: M5Stack IOE1 expander
m5stack_ioe1:
  id: m5stack_ioe1_hub
  i2c_id: bsp_bus
  reset: true

# Si12T Touch Sensor
si12t:
  id: touch_hub
  i2c_id: bsp_bus
  # The original head touch task samples the three channels every 50 ms; the
  # same rate is needed to see the swipe before the finger is lifted.
  update_interval: 50ms

# NFC reader (ST25R3916 on the body I2C bus)
st25r_i2c:
  id: nfc_reader
  i2c_id: bsp_bus
  on_tag:
    then:
      - logger.log:
          format: "NFC tag: %s (%s)"
          args: [x.c_str(), tag.get_tag_type().c_str()]
      - text_sensor.template.publish:
          id: nfc_tag
          state: !lambda 'return x;'
  on_tag_removed:
    then:
      - text_sensor.template.publish:
          id: nfc_tag
          state: ""

remote_transmitter:
  id: ir_tx
  pin: GPIO5
  carrier_duty_percent: 50%
  non_blocking: true

remote_receiver:
  id: ir_rx
  pin: GPIO10

# You can add your own IR devices here
# like IR climate below
climate:
  - platform: coolix
    name: "Default AC"
    visual:
      min_temperature: 18
      max_temperature: 30
      temperature_step: 1

# Expose the raw IR timings to Home Assistant so the device also works as a
# universal IR remote: learn any protocol in HA, replay it through the TX pin.
# Note that this component is EXPERIMENTAL.
infrared:
  - platform: ir_rf_proxy
    id: ir_proxy_tx
    name: "IR Proxy Transmitter"
    remote_transmitter_id: ir_tx
  - platform: ir_rf_proxy
    id: ir_proxy_rx
    name: "IR Proxy Receiver"
    receiver_frequency: 38kHz
    remote_receiver_id: ir_rx

# The SCS9009 serial bus servos.
scs9009:
  id: scs9009_hub
  uart_id: servo_uart
  timeout: 100ms
  min_interval: 5ms

# A finished move releases its own torque; a stalled one releases it from on_error.
ftservo:
  - platform: scs9009
    id: x_servo
    scs9009_id: scs9009_hub
    address: 1
    range: ${servo_x_range}
    zero_position: ${servo_x_zero_position}
    default_time: 600
    release_after_move: true
    update_interval: ${servo_feedback_interval}
    # A stalled move never reaches the move-done path, so this axis releases
    # itself here instead of pushing against the obstacle. `release_after_move`
    # handles every normal end of a move, so nothing else touches the torque.
    on_error:
      - lambda: |-
          if (code & esphome::ftservo::SERVO_ERROR_STALLED)
            id(x_servo)->set_torque(false);

  - platform: scs9009
    id: y_servo
    scs9009_id: scs9009_hub
    address: 2
    range: ${servo_y_range}
    zero_position: ${servo_y_zero_position}
    default_time: 600
    release_after_move: true
    update_interval: ${servo_feedback_interval}
    on_error:
      - lambda: |-
          if (code & esphome::ftservo::SERVO_ERROR_STALLED)
            id(y_servo)->set_torque(false);

# The two servos as a pan/tilt head
stackchan_motion:
  id: head
  yaw_servo: x_servo
  pitch_servo: y_servo
  min_yaw: -164
  max_yaw: 164
  min_pitch: 0
  max_pitch: 90
  home_yaw: 0
  home_pitch: 0
  nudge_step: 10
  default_time: 600

number:
  # One slider pair for the head, owned by the motion layer
  - platform: stackchan_motion
    stackchan_motion_id: head
    yaw:
      name: "Head Yaw"
      min_value: -164
      max_value: 164
      step: 1
      mode: slider

  - platform: stackchan_motion
    stackchan_motion_id: head
    pitch:
      name: "Head Pitch"
      min_value: 0
      max_value: 90
      step: 1
      mode: slider

  # Post-AFE gain. It cannot repair ADC clipping and can itself clip the final
  # output; 18 dB analog gain plus this 6 dB restores the level the wake word
  # engine sees.
  - platform: esp_audio_stack
    esp_audio_stack_id: i2s_duplex
    mic_gain:
      id: mic_gain_number
      name: "Mic Gain"
      min_value: -20
      max_value: 30
      initial_value: 6

button:
  - platform: template
    name: "Power Off"
    icon: "mdi:power"
    entity_category: config
    on_press:
      - axp2101.shutdown: axp2101_pmu

  - platform: template
    name: "Restart SoC"
    icon: "mdi:restart"
    entity_category: config
    on_press:
      - axp2101.restart: axp2101_pmu

  - platform: template
    name: "Reset Fuel Gauge"
    icon: "mdi:battery-sync"
    entity_category: config
    on_press:
      - axp2101.reset_gauge: axp2101_pmu

  # Records the pose the head is in as 0° on both axes and stores it
  - platform: template
    id: servo_calibration
    name: "Servo Calibration"
    icon: "mdi:crosshairs-gps"
    entity_category: config
    on_press:
      - lambda: |-
          if (id(head)->is_moving()) {
            ESP_LOGW("servo_cal", "Head is moving, calibration skipped");
            return;
          }
          if (!id(x_servo)->has_feedback() || !id(y_servo)->has_feedback()) {
            ESP_LOGW("servo_cal", "No position feedback yet, calibration skipped");
            return;
          }
          const uint16_t x = id(x_servo)->feedback().position;
          const uint16_t y = id(y_servo)->feedback().position;
          id(x_servo)->set_zero_position(x);
          id(y_servo)->set_zero_position(y);
          id(servo_x_zero_step) = x;
          id(servo_y_zero_step) = y;
          ESP_LOGI("servo_cal", "Zero position recorded at x=%u, y=%u", static_cast<unsigned>(x),
                   static_cast<unsigned>(y));
      # The globals queue their save on their own 1 s poll; flush it here so the
      # calibration survives a power cut instead of waiting for the 60 s syncer.
      - delay: 1s
      - lambda: global_preferences->sync();

  # Directional nudges for fine movement: one press moves the axis by
  # `nudge_step` from the pose the head is actually in, so presses add up and a
  # head that was pushed by hand continues from where it is. Home returns to the
  # configured pose.
  - platform: stackchan_motion
    stackchan_motion_id: head
    home:
      name: "Move Home"
    left:
      name: "Nudge Left"
    right:
      name: "Nudge Right"
    up:
      name: "Nudge Up"
    down:
      name: "Nudge Down"

binary_sensor:
  # PMIC status bits
  - platform: axp2101
    battery_charging:
      name: "Battery Charging"
    battery_discharging:
      name: "Battery Discharging"
    vbus_good:
      name: "VBUS Good"
    battery_present:
      name: "Battery Present"
      entity_category: diagnostic

# Interrupt sources of the PMIC, so automations can react to the power key and
# to the charger instead of polling the status bits.
event:
  - platform: axp2101
    name: "PMU Event"
    events:
      - vbus_insert
      - vbus_remove
      - battery_insert
      - battery_remove
      - power_key_short_press
      - power_key_long_press
      - charge_started
      - charge_done
    on_event:
      - logger.log:
          format: "AXP2101 event: %s"
          args: [event_type.c_str()]

  # The original firmware compares a 16 m/s² acceleration difference (~1.6 g)
  # and requires the shake to repeat. The ESPHome motion event already compares
  # the vector jerk in g and has a cooldown, so one strong shake is enough here;
  # repeated events simply extend the reaction.
  - platform: motion
    id: imu_shake
    name: "IMU Shake"
    threshold: 1.5
    cooldown: 500ms
    on_event:
      - if:
          condition:
            lambda: return event_type == "shake";
          then:
            - stackchan_ui.shake: stackchan_face

sensor:
  - platform: axp2101
    battery_voltage:
      name: "Battery Voltage"
    battery_level:
      name: "Battery Level"
      filters:
        - delta: 1.0
    vbus_voltage:
      name: "VBUS Voltage"
    system_voltage:
      name: "System Voltage"
    die_temperature:
      name: "AXP2101 Temperature"

  # StackChan body: measured servo positions and the head angles derived from
  # them. `position` and the head `yaw`/`pitch` both come from the same feedback
  # read, so the extra entities cost no bus traffic.
  - platform: ftservo
    ftservo_id: x_servo
    position:
      id: servo_x_position
      name: "Servo X Position"
      filters:
        - delta: 3.0

  - platform: ftservo
    ftservo_id: y_servo
    position:
      id: servo_y_position
      name: "Servo Y Position"
      filters:
        - delta: 3.0

  - platform: stackchan_motion
    stackchan_motion_id: head
    yaw:
      name: "Head Yaw Angle"
      accuracy_decimals: 0
      filters:
        - round: 0
        - delta: 1.0
    pitch:
      name: "Head Pitch Angle"
      accuracy_decimals: 0
      filters:
        - round: 0
        - delta: 1.0

text_sensor:
  # Match the original StackChan firmware: low sensitivity table, level 3.
  # The high-sensitivity default was more sensitive than the original and
  # could register head movement near the 90° limit as a touch.
  - platform: si12t
    id: head_touch_left
    name: "Touch Sensor 1"
    channel: 1
    sensitivity: 3
    high_sensitivity: false
    on_value:
      - script.execute: head_touch_update

  - platform: si12t
    id: head_touch_middle
    name: "Touch Sensor 2"
    channel: 2
    sensitivity: 3
    high_sensitivity: false
    on_value:
      - script.execute: head_touch_update

  - platform: si12t
    id: head_touch_right
    name: "Touch Sensor 3"
    channel: 3
    sensitivity: 3
    high_sensitivity: false
    on_value:
      - script.execute: head_touch_update

  - platform: template
    name: "NFC Tag"
    id: nfc_tag
    icon: mdi:nfc

  - id: text_request
    platform: template
    on_value:
      lambda: |-
        if(id(text_request).state.length()>32) {
          std::string name = id(text_request).state.c_str();
          std::string truncated = esphome::str_truncate(name.c_str(),31);
          id(text_request).state = (truncated+"...").c_str();
        }

  - id: text_response
    platform: template
    on_value:
      lambda: |-
        if(id(text_response).state.length()>32) {
          std::string name = id(text_response).state.c_str();
          std::string truncated = esphome::str_truncate(name.c_str(),31);
          id(text_response).state = (truncated+"...").c_str();
        }

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "LCD Backlight"
    icon: "mdi:television"
    output: lcd_backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

  # 12 RGB LEDs of the StackChan body, driven through the body IO expander.
  - platform: m5stack_ioe1
    id: stackchan_light_bar
    name: "StackChan Light Bar"
    icon: mdi:led-strip
    num_leds: 12
    effects:
      - random:
          name: Random
          transition_length: 1s
          update_interval: 1s
      - addressable_rainbow:
          speed: 10
          width: 50
          name: Rainbow
      - addressable_rainbow:
          name: Rainbow Effect With Custom Values
          speed: 10
          width: 50
      - addressable_twinkle:
          twinkle_probability: 0.05
          progress_interval: 4ms
          name: Twinkle
      - addressable_twinkle:
          name: Twinkle Effect With Custom Values
          twinkle_probability: 0.05
          progress_interval: 4ms
    disabled_by_default: false
    restore_mode: ALWAYS_OFF
    gamma_correct: 2.8
    default_transition_length: 1s
    flash_transition_length: 0s

  # Voice assistant patterns, drawn on top of the light bar.
  # assistant cyan otherwise.
  - platform: partition
    id: voice_assistant_leds
    internal: true
    default_transition_length: 0ms
    segments:
      - id: stackchan_light_bar
        from: 0
        to: 5
      - id: stackchan_light_bar
        from: 6
        to: 11
    effects:
      # Loading fill, both halves grow from the outer ends towards the middle.
      - addressable_lambda:
          name: "Initializing"
          update_interval: 150ms
          lambda: |-
            static uint8_t step = 0;
            if (initial_run)
              step = 0;
            const Color color(24, 187, 242);
            for (int i = 0; i < 12; i++) {
              const int p = (i < 6) ? i : (11 - i);
              it[i] = (p <= step) ? color : Color::BLACK;
            }
            step = (step + 1) % 7;
      # Fast comet towards the middle, mirrored on both halves.
      - addressable_lambda:
          name: "Listening"
          update_interval: 40ms
          lambda: |-
            const auto cv = id(stackchan_light_bar).current_values;
            const Color color = cv.get_state() > 0.0f
                                    ? Color(cv.get_red() * 255, cv.get_green() * 255, cv.get_blue() * 255)
                                    : Color(24, 187, 242);
            const int head = id(led_animation_index) % 6;
            for (int i = 0; i < 12; i++) {
              const int p = (i < 6) ? i : (11 - i);
              const int d = (p - head + 6) % 6;
              if (d == 0) {
                it[i] = color;
              } else if (d == 5) {
                it[i] = color * 160;
              } else if (d == 4) {
                it[i] = color * 80;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(led_animation_index) = (id(led_animation_index) + 1) % 6;
      # The two LEDs nearest the middle breathe while the command is processed.
      - addressable_lambda:
          name: "Thinking"
          update_interval: 16ms
          lambda: |-
            static uint8_t step = 0;
            static bool down = true;
            const uint8_t steps = 8;
            if (initial_run) {
              step = 0;
              down = true;
            }
            const auto cv = id(stackchan_light_bar).current_values;
            const Color color = cv.get_state() > 0.0f
                                    ? Color(cv.get_red() * 255, cv.get_green() * 255, cv.get_blue() * 255)
                                    : Color(24, 187, 242);
            for (int i = 0; i < 12; i++) {
              const int p = (i < 6) ? i : (11 - i);
              it[i] = (p == 5) ? color * uint8_t(255 / steps * (steps - step)) : Color::BLACK;
            }
            if (down) {
              step++;
            } else {
              step--;
            }
            if (step == 0 || step == steps) {
              down = !down;
            }
      # Same comet as listening, but running the other way.
      - addressable_lambda:
          name: "Replying"
          update_interval: 40ms
          lambda: |-
            const auto cv = id(stackchan_light_bar).current_values;
            const Color color = cv.get_state() > 0.0f
                                    ? Color(cv.get_red() * 255, cv.get_green() * 255, cv.get_blue() * 255)
                                    : Color(24, 187, 242);
            const int head = (6 - id(led_animation_index) % 6) % 6;
            for (int i = 0; i < 12; i++) {
              const int p = (i < 6) ? i : (11 - i);
              const int d = (p - head + 6) % 6;
              if (d == 0) {
                it[i] = color;
              } else if (d == 5) {
                it[i] = color * 160;
              } else if (d == 4) {
                it[i] = color * 80;
              } else {
                it[i] = Color::BLACK;
              }
            }
            id(led_animation_index) = (id(led_animation_index) + 1) % 6;
      # Fast red pulse over the whole bar.
      - addressable_lambda:
          name: "Error"
          update_interval: 10ms
          lambda: |-
            static uint8_t step = 0;
            static bool down = true;
            const uint8_t steps = 10;
            if (initial_run) {
              step = 0;
              down = true;
            }
            const Color color(255, 0, 0);
            for (int i = 0; i < 12; i++) {
              it[i] = color * uint8_t(255 / steps * (steps - step));
            }
            if (down) {
              step++;
            } else {
              step--;
            }
            if (step == 0 || step == steps) {
              down = !down;
            }
      # Microphone muted: a steady red pair next to the middle.
      - addressable_lambda:
          name: "Muted"
          update_interval: 500ms
          lambda: |-
            for (int i = 0; i < 12; i++) {
              const int p = (i < 6) ? i : (11 - i);
              it[i] = (p == 5) ? Color(255, 0, 0) : Color::BLACK;
            }
      # No Home Assistant connection: a slow red dot walking along the bar.
      - addressable_lambda:
          name: "Not Ready"
          update_interval: 120ms
          lambda: |-
            const int head = id(led_animation_index) % 6;
            const Color color(255, 0, 0);
            for (int i = 0; i < 12; i++) {
              const int p = (i < 6) ? i : (11 - i);
              it[i] = (p == head) ? color : Color::BLACK;
            }
            id(led_animation_index) = (id(led_animation_index) + 1) % 6;

esp_afe:
  id: afe
  # Full ESP-SR front end at the default sr/low_cost profile with AEC on.
  # Single-mic AEC only. Espressif's ESP32-S3 benchmark puts 2-mic MMR/BSS at
  # feed 23.7% + fetch 22.9% of one core versus 8.8% + 9.8% for MR, and the
  # dual-mic feed path dropped 14.6% of its output frames while music played.
  # Single-mic AEC measured 0% dropped frames with 28 dB of echo return loss.
  aec_nlp_level: normal
  # The codec gain staging and the post-AFE mic_gain number handle level, so
  # the AFE should not add its own noise suppression or automatic gain.
  ns_enabled: false
  agc_enabled: false
  # allocate more psram and save internal sram
  memory_alloc_mode: more_psram
  # Internal AFE task; Core 0 keeps it off the loopTask/feed pair.
  task_core: 0
  # feed runs one priority step above loopTask (raised to 5 in on_boot) and on
  # its own core, so a block is never preempted mid-deadline.
  feed_task_core: 1
  feed_task_priority: 6
  fetch_task_core: 0

esp_audio_stack:
  id: i2s_duplex
  sample_rate: 48000
  output_sample_rate: 16000
  bits_per_sample: 16
  slot_bit_width: 16
  processor_id: afe
  # The CoreS3 wires its microphones to ES7210 MIC1/MIC2 and the AW88298 speaker
  # output back into MIC3 (AEC_P/AEC_N). esp_codec_dev serialises the four TDM
  # slots in ADC order 1,3,2,4, so MIC1 is slot 0, the hardware reference is
  # slot 1 and MIC2 would be slot 2. The AFE runs **single-mic**, so only MIC1 and
  # the reference are captured; a second microphone needs mic_num: 2 with BSS.
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: [0]
  tdm_ref_slot: 1
  tdm_tx_slot: 0
  buffers_in_psram: true
  audio_task_stack_in_psram: true
  telemetry: false

  i2s_mclk_pin:
    number: GPIO0
    ignore_strapping_warning: true
  i2s_bclk_pin: GPIO34
  i2s_lrclk_pin: GPIO33
  i2s_din_pin: GPIO14
  i2s_dout_pin: GPIO13

  codec:
    i2c_id: bsp_bus
    input:
      type: es7210
      address: 0x40
      # ADC1 carries the microphone, ADC3 the playback reference.
      mic_selected: 0x05
      # 24 dB left only ~1 dB of headroom (music peaked at -0.88 dBFS right
      # before the ADC). 18 dB buys ~7 dB, and mic_gain restores the level.
      gain_db: 18
      ref_channel: 2
      # The reference is line level and its SNR helps the AEC, so it keeps 24 dB.
      ref_gain_db: 24
    output:
      type: aw88298
      address: 0x36
      # Same DAC config as the CoreS3 BSP (m5stack_core_s3/src/bsp_audio.c,
      # where pa_voltage/codec_dac_voltage use the esp_codec_dev defaults).
      pa_gain: 0 dB
      pa_voltage: 5.0V
      codec_dac_voltage: 3.3V
      # AW_RST is driven by the IO expander (AW9523B P0_2).
      reset_pin:
        aw9523b_id: aw9523b_hub
        number: 2
        mode: OUTPUT

microphone:
  # Single microphone entity on the AFE-processed stream, shared by the voice
  # assistant and micro wake word.
  - platform: esp_audio_stack
    id: voice_mic
    esp_audio_stack_id: i2s_duplex

speaker:
  - platform: esp_audio_stack
    id: hw_speaker
    esp_audio_stack_id: i2s_duplex
    sample_rate: 48000
    # The duplex speaker only declares stream limits, not a concrete
    # bits_per_sample. ESPHome 2026.5+ mixer inherits this from its
    # output_speaker, so it must be set explicitly or validation fails.
    bits_per_sample: 16

  - platform: mixer
    id: audio_mixer
    output_speaker: hw_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: media_speaker_mix       # Music/radio streams (duckable)
        timeout: 10s
        buffer_duration: 100ms
      - id: tts_speaker_mix         # VA TTS announcements (never ducked)
        timeout: 10s
        buffer_duration: 100ms

  - platform: resampler
    id: media_speaker              # Music/radio → 48kHz
    output_speaker: media_speaker_mix
    task_stack_in_psram: true

  - platform: resampler
    id: tts_speaker                # VA TTS → 48kHz
    output_speaker: tts_speaker_mix
    task_stack_in_psram: true

audio_file:
  - id: wake_word_triggered_sound
    file: ${wake_word_triggered_sound_file}
  - id: error_cloud_expired
    file: ${error_cloud_expired_file}

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000
  - platform: sendspin
    id: sendspin_media_source
    codecs: [FLAC, PCM]

media_player:
  - platform: sendspin
    id: sendspin_group_media_player

  - platform: speaker_source
    id: speaker_media_player
    name: Media Player
    media_pipeline:
      speaker: media_speaker
      sample_rate: 48000
      num_channels: 2
      format: FLAC
      sources:
        - http_media_source
        - sendspin_media_source
    announcement_pipeline:
      speaker: tts_speaker
      sample_rate: 48000
      num_channels: 1
      format: FLAC
      sources:
        - audio_file_announcement_source
        - http_announcement_source
    volume_increment: 0.05
    volume_min: 0.3
    volume_max: 0.85
    on_announcement:
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
            - script.execute: draw_display
      # Duck the music so announcements and TTS stay intelligible.
      - mixer_speaker.apply_ducking:
          id: media_speaker_mix
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing:
                    id: speaker_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_speaker_mix
                decibel_reduction: 0
                duration: 1.0s
    on_idle:
      # Since VA isn't running, this is the end of user-initiated media playback.
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: set_idle_or_mute_phase
            - script.execute: draw_display
            - script.execute: start_wake_word

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

micro_wake_word:
  id: mww
  microphone: voice_mic
  stop_after_detection: false
  models:
    - model: ${hi_stackchan_model_file}
      id: hi_stackchan
    - model: ${okay_nabu_model_file}
      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis
    - model: hey_mycroft
      id: hey_mycroft
  vad:
  on_wake_word_detected:
    # If the wake word is detected while muted (possible with the software mute
    # switch), do nothing.
    - if:
        condition:
          # `mute` ON = microphone muted, so only act when the switch is off.
          switch.is_off: mute
        then:
          # Stop the running voice assistant, otherwise start it.
          - if:
              condition:
                voice_assistant.is_running:
              then:
                - voice_assistant.stop:
              # Stop any other media player announcement. This only dismisses
              # the announcement; say the wake word again to start a command.
              else:
                - if:
                    condition:
                      media_player.is_announcing:
                        id: speaker_media_player
                    then:
                      - media_player.stop:
                          announcement: true
                          id: speaker_media_player
                    # Start the voice assistant and play the wake sound.
                    else:
                      - script.execute:
                          id: play_sound
                          priority: true
                          sound_file: "wake_word_triggered_sound"
                      - delay: 50ms
                      - voice_assistant.start:
                          wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: voice_mic
  media_player: speaker_media_player
  micro_wake_word: mww
  use_wake_word: false
  # The microphone stream is already processed by esp_afe, so no additional
  # noise suppression, gain or volume scaling is applied here.
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_phase_id};
    - stackchan_ui.stop_speaking: stackchan_face
    - text_sensor.template.publish:
        id: text_request
        state: "..."
    - text_sensor.template.publish:
        id: text_response
        state: "..."
    - script.execute: draw_display
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: draw_display
  on_stt_end:
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
    - script.execute: draw_display
  on_tts_start:
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
    - stackchan_ui.start_speaking: stackchan_face
    - script.execute: draw_display
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - stackchan_ui.stop_speaking: stackchan_face
    # Stop ducking the music.
    - mixer_speaker.apply_ducking:
        id: media_speaker_mix
        decibel_reduction: 0
        duration: 1.0s
    # If the end happened because of an error, let the error phase on for a second
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    # Reset the voice assistant phase id and reset the LED animations.
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    # - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
    # Clear text sensors
    - text_sensor.template.publish:
        id: text_request
        state: ""
    - text_sensor.template.publish:
        id: text_response
        state: ""
    # Keep the wake word engine listening for the next command.
    - script.execute: start_wake_word
  on_error:
    - stackchan_ui.stop_speaking: stackchan_face
    # Only set the error phase if the error code is different than duplicate_wake_up_detected or stt-no-text-recognized
    # These two are ignored for a better user experience
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: draw_display
          - delay: 1s
          - if:
              condition:
                switch.is_off: mute
              then:
                - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
              else:
                - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
          - script.execute: control_leds
        # If the error code is cloud-auth-failed, serve a local audio file guiding the user.
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: "error_cloud_expired"
          - script.execute: draw_display

  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: set_idle_or_mute_phase
    - script.execute: draw_display
    - script.execute: start_wake_word

  on_client_disconnected:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id}; 
    - script.execute: draw_display
    - voice_assistant.stop:

switch:
  # PMIC settings.
  - platform: axp2101
    charging:
      name: "Charging"
    gauge:
      name: "Fuel Gauge"
      restore_mode: ALWAYS_ON
    ts_external_input:
      name: "TS External Input"
      restore_mode: ALWAYS_ON

  - platform: gpio
    id: boost_en
    internal: true
    pin:
      aw9523b_id: aw9523b_hub
      number: 15
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: bus_out_en
    internal: true
    pin:
      aw9523b_id: aw9523b_hub
      number: 1
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: usb_otg_en
    internal: true
    pin:
      aw9523b_id: aw9523b_hub
      number: 5
    restore_mode: ALWAYS_OFF

  # Body power: IO1 is the servo VM enable
  - platform: gpio
    name: "Servo Power"
    icon: mdi:electric-switch
    pin:
      m5stack_ioe1_id: m5stack_ioe1_hub
      number: 0
      mode:
        output: true
        pullup: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: Microphone Mute
    id: mute
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - microphone.unmute:
          id: voice_mic
      - stackchan_ui.stop_speaking: stackchan_face
      - script.execute: start_wake_word
      - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
      - script.execute: draw_display

    on_turn_on:
      - microphone.mute:
          id: voice_mic
      - stackchan_ui.stop_speaking: stackchan_face
      - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};
      - script.execute: draw_display

select:
  - platform: axp2101
    charge_current:
      name: "Charge Current"
    charge_voltage:
      name: "Charge Voltage"
      initial_option: 4.1V
    input_current_limit:
      name: "Input Current Limit"
    power_key_long_press:
      name: "Power Key Long Press"

  - platform: template
    id: wake_word_sensitivity
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Sets specific wake word probabilities computed for each particular model
      # Note probability cutoffs are set as a quantized uint8 value, each comment has the corresponding floating point cutoff
      # False Accepts per Hour values are tested against all units and channels from the Dinner Party Corpus.
      # These cutoffs apply only to the specific models included in the firmware: okay_nabu@20241226.3, hey_jarvis@v2, hey_mycroft@v2
      # hi_stackchan has no DipCo figures. Its cutoffs were measured here on LibriSpeech dev-clean (5.8 hours, one
      # continuous stream, ESPHome's detection logic). It is noticeably more trigger happy than the other models, so the
      # steps are smaller and the middle tier keeps the model's manifest default of 0.97.
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
          id(hey_jarvis).set_probability_cutoff(247);   // 0.97 -> 0.563 FAPH on DipCo (Manifest's default)
          id(hey_mycroft).set_probability_cutoff(253);  // 0.99 -> 0.567 FAPH on DipCo
          id(hi_stackchan).set_probability_cutoff(252);  // 0.99 -> 1.0 FAPH on LibriSpeech dev-clean
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(235);   // 0.92 -> 0.939 FAPH on DipCo
          id(hey_mycroft).set_probability_cutoff(242);  // 0.95 -> 1.502 FAPH on DipCo (Manifest's default)
          id(hi_stackchan).set_probability_cutoff(247);  // 0.97 -> 2.1 FAPH on LibriSpeech dev-clean (Manifest's default)
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(212);   // 0.83 -> 1.502 FAPH on DipCo
          id(hey_mycroft).set_probability_cutoff(237);  // 0.93 -> 1.878 FAPH on DipCo
          id(hi_stackchan).set_probability_cutoff(240);  // 0.94 -> 3.1 FAPH on LibriSpeech dev-clean
        }

display:
  - platform: mipi_spi
    model: M5CORE
    dc_pin: GPIO35
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 9
    cs_pin:
      number: GPIO3
      ignore_strapping_warning: true
    data_rate: 40MHz
    update_interval: never
    invert_colors: true
    id: m5cores3_lcd

lvgl:
  displays:
    - m5cores3_lcd
  touchscreens:
    - touch
  widgets: []

# The face owns the LVGL screen; do not add lvgl widgets or pages here.
stackchan_ui:
  id: stackchan_face
  font_id: ui_font
  on_head_pet:
    - if:
        condition:
          not:
            stackchan_motion.is_moving: head
        then:
          # Only the pitch servo moves; yaw stays where it is. The base is the
          # measured pitch, so a number slider move cannot leave a stale
          # stackchan_motion target behind.
          - if:
              condition:
                lambda: |-
                  if (!id(y_servo)->has_feedback())
                    return false;
                  const float current = id(y_servo)->current_angle();
                  // Keep the 10° nudge inside the 0..60° command range.
                  return current >= -10.0f && current < 60.0f;
              then:
                # The pitch servo stalls at the top of its travel, so the pet
                # reaction only raises the head to 60°.
                - lambda: id(head_pet_moved) = true;
                - ftservo.move_angle:
                    id: y_servo
                    angle: !lambda |-
                      const float current = id(y_servo)->current_angle();
                      const float target = current + 10.0f;
                      return target > 60.0f ? 60.0f : target;
  on_head_pet_restore:
    # Only pitch returns to 0, and only if the pet actually moved it; yaw is
    # left untouched. A pet that was ignored because the head was already at
    # the 60° cap must not trigger a jump to 0.
    - if:
        condition:
          lambda: return id(head_pet_moved);
        then:
          - lambda: id(head_pet_moved) = false;
          - ftservo.move_angle:
              id: y_servo
              angle: 0
              time: 200
  on_shake:
    - stackchan_motion.home: head

touchscreen:
  - platform: ft63x6
    id: touch
    i2c_id: bsp_bus
    reset_pin:
      aw9523b_id: aw9523b_hub
      number: 0
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 240

script:
  # Powers the 5 V BUS
  - id: bus_power_on
    then:
      - lambda: |-
          // A converter under-voltage latches the AXP2101 off until the power
          // key is pressed, and the BUS is a capacitive load, so the latch is
          // cleared before the boost is switched onto it.
          if (const auto *uvp = id(axp2101_pmu)->find_flag("dcdc_uvp_shutdown"); uvp != nullptr)
            id(axp2101_pmu)->write_flag(*uvp, false);

          // turn on the BOOST_EN
          id(boost_en)->turn_on();
          delay(50);

          // Eight pulses of growing on-time bring the cold body rail up to a few
          // volts.
          for (int pulse = 0; pulse < 8; ++pulse) {
            id(bus_out_en)->turn_on();
            delayMicroseconds(pulse * 16);
            id(bus_out_en)->turn_off();
            delayMicroseconds(1000);
          }
          // turn on the BUS_OUT_EN
          id(bus_out_en)->turn_on();
          delay(100);

  # Head pet gesture, ported from the original StackChan TouchData/GestureRecognizer
  - id: head_touch_update
    then:
      - lambda: |-
          const auto level = [](const std::string &value) -> int {
            if (value == "High")
              return 3;
            if (value == "Medium")
              return 2;
            if (value == "Low")
              return 1;
            return 0;
          };
          const uint32_t now = millis();
          const int left = level(id(head_touch_left).state);
          const int middle = level(id(head_touch_middle).state);
          const int right = level(id(head_touch_right).state);
          const int total = left + middle + right;
          const bool touched = total > 0;
          const int position = total == 0 ? 0 : (right * 100 - left * 100) / total;

          switch (id(head_touch_state)) {
            case 0:
              if (touched) {
                id(head_touch_state) = 1;
                id(head_touch_initial_position) = position;
                id(head_touch_started_ms) = now;
              }
              break;
            case 1:
              if (!touched) {
                id(head_touch_state) = 0;
                id(stackchan_face)->head_pet_release();
              } else if (now - id(head_touch_started_ms) >= 100 &&
                         (position - id(head_touch_initial_position) > 40 ||
                          position - id(head_touch_initial_position) < -40)) {
                id(head_touch_state) = 2;
                id(stackchan_face)->head_pet_hold();
              }
              break;
            default:
              if (!touched) {
                id(head_touch_state) = 0;
                id(stackchan_face)->head_pet_release();
              }
              break;
          }

  # Drives the light bar from the voice assistant phase. Called from
  # draw_display, which already runs on every phase and connection change.
  - id: control_leds
    then:
      - lambda: |-
          const int phase = id(voice_assistant_phase);
          const auto bar = id(stackchan_light_bar).current_values;
          const bool bar_on = bar.get_state() > 0.0f;
          // Follow the user facing bar colour when it is on, otherwise use the
          // default assistant cyan so the patterns stay visible.
          float red = bar_on ? bar.get_red() : 24.0f / 255.0f;
          float green = bar_on ? bar.get_green() : 187.0f / 255.0f;
          float blue = bar_on ? bar.get_blue() : 242.0f / 255.0f;
          float brightness = bar.get_brightness() < 0.2f ? 0.2f : bar.get_brightness();

          std::string effect;
          if (id(init_in_progress)) {
            if (wifi::global_wifi_component->is_connected()) {
              effect = "Initializing";
            } else {
              red = 1.0f;
              green = 0.89f;
              blue = 0.71f;
              effect = "none";
            }
          } else if (!api::global_api_server->is_connected()) {
            red = 1.0f;
            green = 0.0f;
            blue = 0.0f;
            effect = "Not Ready";
          } else if (phase == ${voice_assist_listening_phase_id}) {
            effect = "Listening";
          } else if (phase == ${voice_assist_thinking_phase_id}) {
            effect = "Thinking";
          } else if (phase == ${voice_assist_replying_phase_id}) {
            effect = "Replying";
          } else if (phase == ${voice_assist_error_phase_id}) {
            red = 1.0f;
            green = 0.0f;
            blue = 0.0f;
            effect = "Error";
          } else if (phase == ${voice_assist_muted_phase_id}) {
            effect = "Muted";
          } else {
            // Idle: hand the bar back to whatever the user set it to.
            id(voice_assistant_leds).turn_off().perform();
            if (bar_on) {
              id(stackchan_light_bar).turn_on().perform();
            }
            return;
          }

          auto call = id(voice_assistant_leds).make_call();
          call.set_state(true);
          call.set_brightness(brightness);
          call.set_rgb(red, green, blue);
          call.set_effect(effect);
          call.perform();

  - id: draw_display
    then:
      - script.execute: control_leds
      - stackchan_ui.set_emotion:
          id: stackchan_face
          emotion: !lambda |-
            if (id(init_in_progress))
              return std::string("sleepy");
            if (!wifi::global_wifi_component->is_connected() || !api::global_api_server->is_connected())
              return std::string("sad");
            switch (id(voice_assistant_phase)) {
              case ${voice_assist_thinking_phase_id}:
                return std::string("doubt");
              case ${voice_assist_replying_phase_id}:
                return std::string("happy");
              case ${voice_assist_error_phase_id}:
                return std::string("angry");
              case ${voice_assist_muted_phase_id}:
                return std::string("sleepy");
              default:
                return std::string("neutral");
            }
      - stackchan_ui.set_speech:
          id: stackchan_face
          text: !lambda |-
            if (id(init_in_progress))
              return std::string("Starting...");
            if (!wifi::global_wifi_component->is_connected())
              return std::string("No Wi-Fi");
            if (!api::global_api_server->is_connected())
              return std::string("No Home Assistant");
            switch (id(voice_assistant_phase)) {
              case ${voice_assist_thinking_phase_id}:
                return id(text_request).state;
              case ${voice_assist_replying_phase_id}:
                return id(text_response).state;
              case ${voice_assist_error_phase_id}:
                return std::string("Error");
              case ${voice_assist_muted_phase_id}:
                return std::string("Muted");
              default:
                return std::string("");
            }

  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          else:
            - lambda: id(voice_assistant_phase) = ${voice_assist_muted_phase_id};

  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - lambda: return !id(init_in_progress);
              - switch.is_off: mute
              - lambda: return !id(mww).is_running();
          then:
            - micro_wake_word.start

  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: speaker_media_player
                announcement: true
      - lambda: |-
          if ( (id(speaker_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(speaker_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }
font:
  - file:
      type: gfonts
      family: ${font_family}
    id: ui_font
    size: 24
    glyphsets:
      - ${font_glyphsets}
